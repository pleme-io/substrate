# pleme-io typed-emission enforcement.
#
# Canonical: https://github.com/pleme-io/theory/blob/main/TYPED-EMISSION.md
# Operationalized by: pleme-io/substrate/lib/build/rust/format-ban.nix
#
# `format!()` is banned across pleme-io Rust crates. Use:
#   - `write!()` / `writeln!()` inside `Display`/`Debug`/`Serialize` impls
#   - typed logging macros (`tracing::*`)
#   - typed error macros (`anyhow::anyhow!()` / `anyhow::bail!()`)
#   - typed AST renderers (`nix-synthesizer::NixValue`, `serde_yaml`,
#     arch-synthesizer's `Action` / `GoNode` domains, etc.)
#   - typed value builders (`PathBuf::join`, `url::Url::parse_with_params`,
#     `Command::arg`, `sea-orm` query builders, etc.)
#
# Adopt by copying or symlinking this file to your repo root as
# `clippy.toml`, OR by depending on the Nix helper from
# `substrate/lib/build/rust/format-ban.nix` to render it at build time.

# MUST STAY ON ONE LINE. A TOML inline table cannot span lines, so the
# previous pretty-printed form
#
#   disallowed-macros = [
#     { path = "std::format",
#       reason = "..." },
#   ]
#
# was INVALID TOML, and clippy refused the whole file with
# `error: error reading Clippy's configuration file: invalid inline table`.
# That is not a soft failure: clippy aborts the compile, so a repo adopting
# this file got a hard build error rather than a format!() lint — and any
# repo whose CI never ran clippy simply carried a config that had never once
# been parsed. Confirmed live 2026-07-26 in format-ban, the very repo that
# enforces this rule fleet-wide.
disallowed-macros = [{ path = "std::format", reason = "format!() is banned per pleme-io/theory/TYPED-EMISSION.md. Use write!() inside Display/Debug impls, tracing::* for logs, anyhow::anyhow!()/bail!() for errors, or a typed AST renderer. Free-form string composition is a substrate gap; close it." }]
