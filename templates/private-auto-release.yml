# auto-release.yml — GitHub Packages (private crates)
#
# Drop this file at .github/workflows/auto-release.yml in any private
# pleme-io Rust repo. Every push to main auto-bumps, tags, and
# publishes to GitHub Packages.
#
# PREREQUISITES:
#   1. Copy .cargo/config.toml from substrate/templates/private-cargo-config.toml
#      to the repo root (.cargo/config.toml)
#   2. Add `publish = ["pleme-io"]` to each crate's [package] section
#      in Cargo.toml — this prevents accidental crates.io publishes
#   3. Add `version` to every workspace.dependencies path dep (same as
#      the public auto-release — cargo needs version for registry resolution)
#   4. Ensure no git deps remain (or they're optional) — GitHub Packages
#      rejects non-optional git deps the same way crates.io does

name: auto-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/rust-private-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
      registry-name: pleme-io
    secrets: inherit
