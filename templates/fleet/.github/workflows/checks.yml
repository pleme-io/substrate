name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fleet:
    uses: pleme-io/substrate/.github/workflows/nix-fleet.yml@main
    secrets: inherit
    with:
      runner-labels: '["self-hosted","pleme-private"]'
      eval-checks: '["fleet-proofs"]'
      nodes: auto
