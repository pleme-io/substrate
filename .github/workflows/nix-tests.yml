name: nix-tests

# Eval-time tests for substrate's typed Nix functions. Each test
# expression evaluates to `{ total = N; passed = N; }` on success or
# throws on the first failure — `nix-instantiate --eval --strict`
# returns non-zero on throw, so the step fails closed.
#
# Add a new entry here for each `tests/*-test.nix` you ship under
# `lib/build/<area>/tests/`. The pattern is uniform: one Nix
# expression, exit non-zero on throw, gate on it.
#
# THREE TEST FAMILIES SHIP IN THIS REPO, and only one of them used to run
# here. Know which one you are adding:
#
#   A. self-evaluating  — no arguments, `throw`s on the first failure.
#      Run directly: `nix-instantiate --eval --strict <file>`.
#      e.g. lib/build/estante/tests/*, lib/util/darwin-test.nix.
#
#   B. `{ lib }` + `asCheck pkgs` — wired into `checks.<system>.*` in
#      flake.nix. `nix-instantiate` CANNOT run these (they take `lib`),
#      so they need `nix build .#checks.<system>.<name>`.
#      e.g. mutating-verbs, rust-shape, rust-test-check, the two gates.
#
#   C. REPORT-RETURNING — the suite evaluates to a VALUE describing the
#      run (`runTests`'s `{ total; allPassed; failures; … }`, an
#      `allPassed` attr, or `{ passed; total; }`). Run through the
#      catalog + gate in `lib/util/eval-suites.nix`.
#      e.g. lib/types/tests.nix, lib/kube/tests.nix, lib/hm/tests.nix,
#      lib/infra/tests*, lib/build/shared/*-test.nix.
#
# Family B ran in NO job on ANY trigger until 2026-07-28. Substrate has
# exactly two workflows that fire on a push to its own main —
# `auto-bump.yml` (tags only, runs no tests) and this one — and nothing
# anywhere ran `nix flake check` or built `checks.<system>.*`. So the
# `mutating-verbs` suite (30 tests, ten of them written days earlier
# specifically to catch retirement-before-composition drift) was
# green-by-never-running, and so were `rust-shape`, `rust-test-check`,
# `flake-checks-gate` and `devshell-preflight` — five suites, all of
# them the NEWER ones, all invisible.
#
# Family C ran in NO job either, and was far larger: 22 suites, 830
# assertions, wired 2026-07-28 by the four jobs at the bottom of this
# file. See `lib/util/eval-suites.nix` for the catalog.
#
# ⚠ FAMILY C CANNOT BE WIRED THE WAY FAMILY A IS. `runTests` does NOT
# throw on failure — it returns `allPassed = false` and keeps going. So
# `nix-instantiate --eval --strict lib/util/tests.nix` exits 0 whether
# every assertion passes or every assertion fails; it catches only an
# EVALUATION error. Measured on a deliberately-broken copy of that file
# (2026-07-28): the family-A command exited 0 while the gate exited 1.
# Wiring family C by copying the family-A steps would have added four
# jobs running 830 assertions and gating on none of them.
#
# NOTE THE ORDER OF THE FIX. Adding `lib/infra/**` to the path filter
# on its own would have been VACUOUS: the three jobs below read nothing
# under `lib/infra`, so the workflow would have fired and verified
# nothing, while the trigger list read as coverage. The job comes
# first; the path is what points at it.

on:
  push:
    branches:
      - main
    paths:
      # lib/build/**  — was three named subtrees (estante, rust, go). Widened
      #                 2026-07-28: lib/build/shared/*-test.nix loads
      #                 `lib/build/<ecosystem>/quirk-apply.nix` across EVERY
      #                 ecosystem, so a change under lib/build/python (or any
      #                 future subtree) can break a watched suite. Naming
      #                 subtrees one at a time reproduces the defect this
      #                 workflow exists to fix: the next subtree added is
      #                 unwatched by default. The wildcard fails the other
      #                 way, which is the correct direction for a gate.
      # lib/infra/**  — mutating-verbs, plus the eight infra eval suites.
      # lib/util/**   — darwin-test.nix already ran below while nothing
      #                 watched the tree it tests; the two gate suites and
      #                 the eval-suites catalog live here too.
      # lib/types/**  — 144 assertions (tests + assertion-tests + the two
      # lib/kube/**   —  57 assertions   property suites); watched from
      # lib/hm/**     —  65 assertions   2026-07-28, when they first ran.
      # lib/iroha/**  — checks.iroha, and lib/kata/** checks.kata: both
      # lib/kata/**     declared for months and built by no job until
      #                 2026-07-28, so neither tree was watched either.
      # skills/**     — checks.skill-map lints exactly these.
      # flake.nix     — declares `checks.<system>.*`; dropping a check
      #                 there is exactly the regression this gates.
      - 'lib/build/**'
      - 'lib/infra/**'
      - 'lib/util/**'
      - 'lib/types/**'
      - 'lib/kube/**'
      - 'lib/hm/**'
      - 'lib/iroha/**'
      - 'lib/kata/**'
      - 'lib/ci/**'
      - '.github/workflows/*.yml'
      - 'skills/**'
      - 'flake.nix'
      - '.github/workflows/nix-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/build/**'
      - 'lib/infra/**'
      - 'lib/util/**'
      - 'lib/types/**'
      - 'lib/kube/**'
      - 'lib/hm/**'
      - 'lib/iroha/**'
      - 'lib/kata/**'
      - 'lib/ci/**'
      - '.github/workflows/*.yml'
      - 'skills/**'
      - 'flake.nix'
      - '.github/workflows/nix-tests.yml'
  workflow_dispatch:

jobs:
  estante-loaders:
    name: estante — loader + verifier eval tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: lockfile-loader-test.nix
        run: nix-instantiate --eval --strict lib/build/estante/tests/lockfile-loader-test.nix

      - name: receipt-loader-test.nix
        run: nix-instantiate --eval --strict lib/build/estante/tests/receipt-loader-test.nix

      - name: mk-receipt-verifier-test.nix
        run: nix-instantiate --eval --strict lib/build/estante/tests/mk-receipt-verifier-test.nix

  rust-overrides:
    name: rust — crate-override + quirk-apply eval tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: crate-override-compose-test.nix
        run: nix-instantiate --eval --strict lib/build/rust/crate-override-compose-test.nix

      - name: quirk-apply-test.nix
        run: nix-instantiate --eval --strict lib/build/rust/quirk-apply-test.nix

      - name: darwin-test.nix (mkDarwinBuildInputs private-frameworks hook)
        run: nix-instantiate --eval --strict lib/util/darwin-test.nix

      # ══ INV-4 — "No Import-from-Derivation" ═══════════════════════════
      #
      # docs/cia/cache-theory.md §INV-4 declared this invariant, named a
      # checker `ifd_avoidance`, and marked it manual-fix. THAT CHECKER DID
      # NOT EXIST — measured 2026-08-18 at HEAD dbe58e6, `git grep
      # allow-import-from-derivation` over the whole repo returns ZERO hits:
      # the option is never named, let alone set, in any workflow or suite.
      # This step is the first enforcement the invariant has ever had.
      #
      # Note it enforces the AXIOM (C6, "evaluation must not build"), not
      # INV-4's rule TEXT, which says only "generated files must be
      # committed". Every repo the fleet-wide IFD hit already had a committed
      # `Cargo.gen.lock`; an audit of exactly what INV-4 says would have
      # reported all of them clean.
      #
      # ⚠ `--option allow-import-from-derivation false` IS THE GATE. A Nix
      # expression cannot disable IFD for itself, so the enforcement has to be
      # the INVOCATION; drop the flag and this step degrades to "does the
      # fixture evaluate", which it does either way. Keep it, and keep it on
      # THIS step — it is scoped to one small check on purpose, because
      # substrate's own `packages.<sys>.gen` bootstrap is IFD BY CONSTRUCTION
      # (gen's source is fetched as a derivation and a flake-builder evaluated
      # over it), so a repo-wide `nix flake check` under this option would be
      # red for a reason that is not a defect.
      #
      # WHAT IT WATCHES. `lib/build/rust/tests/fixtures/git-dep-delta` is a
      # three-file committed workspace (Cargo.toml + Cargo.lock +
      # Cargo.gen.lock — the delta reader returns null unless all three exist)
      # whose one dependency is a GIT dep on pleme-io/shibori at a tagged rev,
      # with its NAR pinned in the delta's `git_nar_sha256`. That is
      # deliberately the branch that regressed: `mkSrcOf` resolves a git
      # source and then probes INSIDE the fetched tree with
      # `builtins.pathExists`, which forces a build mid-eval whenever the
      # fetch produced a derivation. A registry-only fixture would sail
      # through this step forever while never touching that branch, so the
      # check asserts the git-source COUNT as well.
      #
      # This job rather than `flake-checks` because `flake-checks` is red on
      # `checks.workflow-catalog` (2026-08-18, run 32121068202) and a new gate
      # landing inside an already-failing job is a gate nobody can read.
      #
      # NOT VACUOUS — three red runs, 2026-08-18 on aarch64-darwin, each
      # restored afterwards. (1) Reintroducing the IFD (`gh = null`, i.e. the
      # pre-2026-07-26 shape where every github git dep went through
      # `fetchgit`): this exact command exits 1 with `cannot build
      # '/nix/store/…-shibori-53e586a.drv^out' during evaluation because the
      # option 'allow-import-from-derivation' is disabled`. (2) The same break
      # WITHOUT the option: 7/8, failing
      # `git-source-carries-no-derivation-dependency` — the check's own
      # structural guard, so losing the flag degrades rather than blinds.
      # (3) Pointing it at a registry-only fixture: 4/8, failing
      # `fixture-still-exercises-the-git-branch: expected exactly 1 git
      # source in the fixture, found 0`.
      - name: checks.rust-git-source-ifd-free (INV-4 — eval must not build)
        run: |
          nix build --no-link -L \
            --option allow-import-from-derivation false \
            '.#checks.x86_64-linux.rust-git-source-ifd-free'

      # ══ INV-4, SECOND SUBJECT — THE PINNED GEN ════════════════════════
      #
      # ★ THE STEP ABOVE DOES NOT CATCH THE DEFECT THAT PROMPTED IT. Measured
      # 2026-08-18 by an adversarial review: with BOTH gen-pin.json files
      # reverted to the exact defective revs (rust bd36597c, go e8feaecf), the
      # fixture check above still passed 8/8 at the IDENTICAL store path. Its
      # subject and the fleet's IFD are DISJOINT — the fixture exercises a
      # CONSUMER's own delta path, while the fleet's IFD lived inside GEN's
      # evaluation, reached by every consumer because wrapWithRuntimeGen
      # (lib/build/rust/tool-release.nix) puts gen on the built binary's PATH
      # and so forces gen's drvPath during eval.
      #
      # This step watches the thing that actually regressed: the gen revision
      # THIS REPO PINS. The rev is read from gen-pin.json rather than written
      # here, so the gate follows the pin instead of drifting from it.
      #
      # Verified both directions, which is what makes it a gate and not a
      # decoration:
      #   c6d56f02 (current) -> "/nix/store/…-rust_gen-cli-0.1.45.drv"
      #   bd36597c (previous) -> error: cannot build
      #                          '/nix/store/…-shikumi-3913d35.drv^out'
      #                          during evaluation
      #
      # Any future pin whose evaluation needs a build — a git dep, a
      # fetched-then-read source, anything — fails here before it reaches a
      # single consumer. That is the 35s-per-eval tax this exists to prevent.
      - name: INV-4 — the pinned gen must evaluate without building
        run: |
          for f in lib/build/rust/gen-pin.json lib/build/go/gen-pin.json; do
            rev=$(nix eval --impure --raw --expr "(builtins.fromJSON (builtins.readFile ./$f)).rev")
            echo "::group::$f -> $rev"
            nix eval --option allow-import-from-derivation false \
              "github:pleme-io/gen/$rev#packages.x86_64-linux.host-tool.drvPath"
            echo "::endgroup::"
          done

  go-package-graph:
    name: go — gen-gomod M1 per-package interpreter eval tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: package-graph-test.nix
        run: nix-instantiate --eval --strict lib/build/go/tests/package-graph-test.nix

  flake-checks:
    # Family B (see header): the five `{ lib }` + `asCheck pkgs` suites
    # declared in flake.nix. `nix build` on the check attribute is the
    # only way to run them — and until this job existed, nothing did.
    #
    # Built as five separate steps rather than one `nix flake check` on
    # purpose: `nix flake check` also evaluates every package, devShell
    # and app in a repo this size, so a failure there says "substrate is
    # red" instead of naming the suite. One step per suite keeps the
    # failure legible, and matches the one-expression-per-step shape the
    # three jobs above already use.
    name: infra + util + rust — flake `checks` suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: checks.mutating-verbs (lib/infra — 30 tests)
        run: nix build --no-link -L '.#checks.x86_64-linux.mutating-verbs'

      - name: checks.rust-shape (lib/build/rust)
        run: nix build --no-link -L '.#checks.x86_64-linux.rust-shape'

      - name: checks.rust-test-check (lib/build/rust)
        run: nix build --no-link -L '.#checks.x86_64-linux.rust-test-check'

      - name: checks.flake-checks-gate (lib/util)
        run: nix build --no-link -L '.#checks.x86_64-linux.flake-checks-gate'

      - name: checks.devshell-preflight (lib/util)
        run: nix build --no-link -L '.#checks.x86_64-linux.devshell-preflight'

      # The other FOUR declared checks. The five steps above were wired on
      # 2026-07-28 and these were left behind in the same commit — so
      # `checks.<system>` had nine entries and CI built five of them, which
      # is the same defect one layer over: a check that no job builds is
      # green because nothing ran it. Each verified locally on
      # aarch64-darwin before wiring (2.2s / 1.4s / 3.3s / 2.1s, all green),
      # so none of these is a long pole.
      - name: checks.iroha (lib/iroha — every letter's suite)
        run: nix build --no-link -L '.#checks.x86_64-linux.iroha'

      - name: checks.kata (lib/kata — fleet vocabulary)
        run: nix build --no-link -L '.#checks.x86_64-linux.kata'

      - name: checks.go-minimal-image (lib/build/go — base-selection forcing-function)
        run: nix build --no-link -L '.#checks.x86_64-linux.go-minimal-image'

      - name: checks.skill-map (skills/ — per-skill structure gate)
        run: nix build --no-link -L '.#checks.x86_64-linux.skill-map'

      # The two image checks. Both BUILD AN IMAGE AND BIND A SOCKET, which is
      # why they were named-but-unbuilt rather than wired blind: a
      # socket-binding sandbox build that has never been observed to run is how
      # a gate lands red on main. They are wired here together, and the first
      # green run on a workflow_dispatch is what closes the
      # pending-unbuilt-check note that used to live at this spot.
      - name: checks.go-minimal-image-serves (lib/build/go — scratch base serves /health)
        run: nix build --no-link -L '.#checks.x86_64-linux.go-minimal-image-serves'

      - name: checks.go-hardened-image (lib/build/go — PIE, stripped, non-root, serves)
        run: nix build --no-link -L '.#checks.x86_64-linux.go-hardened-image'

      - name: checks.web-static-spa-image (lib/build/web — port rule, no libc, shaped /bin/sh)
        run: nix build --no-link -L '.#checks.x86_64-linux.web-static-spa-image'

      # CATALOG REFLECTION for the reusable-workflow library itself — the one
      # large substrate surface that had no catalog while lib/iroha and
      # lib/util/eval-suites both did. Derived from this very directory, so
      # editing ANY workflow here can move its verdict: hence the path filter
      # addition below, without which this job would be the vacuous shape the
      # header already warns about (a trigger that reads as coverage while the
      # job reads nothing it watches).
      - name: checks.workflow-catalog (.github/workflows — header + migration ratchets)
        run: nix build --no-link -L '.#checks.x86_64-linux.workflow-catalog'

  # ══ Family C (see header) ══════════════════════════════════════════
  #
  # 22 report-returning suites, 830 assertions, none of which ran in any
  # job on any trigger before 2026-07-28. Every step below goes through
  # `lib/util/eval-suites.nix`, which reads the suite's VERDICT — running
  # these files directly with `nix-instantiate --eval --strict` exits 0 on
  # a failing suite, because `runTests` reports rather than throws.
  #
  # One step per suite, matching the shape the three jobs above already
  # use: a failure names the suite, not "substrate is red". The catalog
  # also enforces a per-suite assertion FLOOR, so a suite that silently
  # loses tests fails instead of reporting a smaller green.
  #
  # NOT VACUOUS: verified red against three deliberately-broken inputs
  # before landing, not merely observed green — a flipped assertion in
  # lib/util/tests.nix (1 of 22 failed, exit 1, where the naive family-A
  # command exited 0 on the same file), six tests deleted from
  # lib/types/tests.nix (SHRANK 73 < 79, exit 1), and an unknown suite
  # name (exit 1). All three restored green afterwards.

  types-kube-suites:
    name: types + kube — eval suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      # The catalog's own forcing-function: fails when a suite has been
      # added to lib/util/eval-suites.nix but given no step in this file.
      # "Catalogued and running nowhere" is the precise defect this whole
      # workflow repairs; this makes it unable to recur silently.
      - name: eval-suites catalog covers every step
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "coverage"; }'

      - name: types/tests.nix (79 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "types/tests"; }'

      - name: types/assertion-tests.nix (47 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "types/assertion-tests"; }'

      - name: types/property-tests.nix — information flow (8 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "types/property-information-flow"; }'

      - name: types/property-tests.nix — convergence stages (10 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "types/property-convergence-stages"; }'

      - name: kube/tests.nix (57 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "kube/tests"; }'

  hm-util-suites:
    name: hm + util — eval suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: hm/tests.nix (65 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "hm/tests"; }'

      - name: util/tests.nix (22 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "util/tests"; }'

      # Wiring invariant: every provider that execs a forge push/image-release
      # must export DOCA_BIN. Seals a defect hand-fixed SEVEN times over two
      # days; the suite's own header carries the receipts.
      - name: util/forge-tool-env (8 assertions — DOCA_BIN at every forge-push provider)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "util/forge-tool-env"; }'

  infra-suites:
    name: infra — eval suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: infra/tests.nix (105 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/tests"; }'

      - name: infra/tests/convergence-improvements-test.nix (26 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/convergence-improvements"; }'

      - name: infra/tests/leptos-deploy-test.nix (30 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/leptos-deploy"; }'

      - name: infra/tests/all-scaffolds-test.nix (26 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/all-scaffolds"; }'

      - name: infra/tests/scaffold-test.nix (15 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/scaffold"; }'

      - name: infra/tests/scaffold-completeness-test.nix (32 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/scaffold-completeness"; }'

      - name: infra/tests/scaffold-snapshot-test.nix (12 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/scaffold-snapshot"; }'

      - name: infra/tests/scaffold-compile-test.nix (52 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "infra/scaffold-compile"; }'

  build-suites:
    name: build — shared + nixos + rust + go eval suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}

      - name: build/shared/dispatcher-coverage-test.nix (49 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/shared/dispatcher-coverage"; }'

      - name: build/shared/fleet-catalog-coverage-test.nix (103 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/shared/fleet-catalog-coverage"; }'

      - name: build/shared/quirk-applier-test.nix (19 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/shared/quirk-applier"; }'

      - name: build/shared/typed-dispatcher-test.nix (8 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/shared/typed-dispatcher"; }'

      - name: build/nixos/tests.nix (38 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/nixos/tests"; }'

      - name: build/rust/tests/spec-invariants-test.nix (11 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/rust/spec-invariants"; }'

      - name: build/rust/tests/cargo-nix-tie-test.nix (20 assertions)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "build/rust/cargo-nix-tie"; }'

      - name: util/gen-pin-gate.nix (cross-file pin distinctness)
        run: nix-instantiate --eval --strict --expr 'import ./lib/util/eval-suites.nix { only = "util/gen-pin"; }'

      - name: build/go/tests/cgo-contract-test.nix (8 assertions)
