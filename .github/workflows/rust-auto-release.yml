name: rust-auto-release

# Reusable workflow: on push to main, bump the workspace patch
# version + commit + tag + push + ship every workspace member to
# the upstream registry. Auto-renames conflicts, auto-skips
# already-published, auto-sleeps on rate-limits, auto-defers
# crates whose deps aren't yet on the registry.
#
# Consumer (.github/workflows/auto-release.yml):
#
#   on: { push: { branches: [main] } }
#   jobs:
#     release:
#       uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
#       secrets: inherit
#
# Three lines of operator config. Everything else is pure
# composition of pleme-io/actions/* primitives (each backed by
# Rust + tatara-lisp).
#
# secrets passed through:
#   CRATES_API_TOKEN — org-level secret; this workflow bridges to
#                      CARGO_REGISTRY_TOKEN env that cargo reads.
#   BOT_PAT          — optional PAT with `repo` scope. If present,
#                      tag pushes can trigger downstream workflows.

on:
  workflow_call:
    inputs:
      bump-type:
        description: "patch | minor | major"
        type: string
        required: false
        default: patch
      source-paths:
        description: "Space-separated git pathspecs the skip-detector inspects for changes since the last tag. Default catches any Rust source (`*.rs`, matched at any depth) + the workspace manifests, so a SOURCE-only change (no Cargo.toml/Cargo.lock edit) still triggers a bump+publish. The old `Cargo.toml Cargo.lock` default silently skipped every source-only push (the 2026-06-03 never-publishing bug). Override for layouts with significant non-`.rs` source."
        type: string
        required: false
        default: "*.rs Cargo.toml Cargo.lock"
      add-paths:
        description: >-
          Space-separated git pathspecs the bump commit stages. Default covers
          root + all workspace member Cargo.toml files, plus BOTH co-outputs of
          the `gen build .` that ensure-gen-lock-fresh already runs during the
          bump (stdlib.tlisp regen-gen-lock, after the version write and before
          the commit): Cargo.gen.lock AND Cargo.build-spec.json. Only the lock
          was ever staged, so the regenerated spec died with the runner and
          every repo that COMMITS its spec (17 fleet-wide, deliberately
          un-gitignored for no-IFD deterministic builds) went stale on release.
          Safe for the ~406 repos that DO gitignore it: git-commit-tag stages
          per-path under exec-check, which returns the status rather than
          raising, so an ignored (exit 1) or absent (exit 128) pathspec fails
          alone. Verified empirically, not inferred. No crate-path arm here —
          this reusable has no such input; a workspace bump always runs at the
          repo root (hard-errored in rust-workspace-bump/run.tlisp).
        type: string
        required: false
        default: "Cargo.toml Cargo.lock Cargo.nix Cargo.gen.lock Cargo.build-spec.json"
      rename-prefix:
        description: "Prefix used when auto-renaming a conflicting crate at registry-publish time."
        type: string
        required: false
        default: "pleme-io-"
      no-verify:
        description: "Skip cargo publish's verification compile step."
        type: string
        required: false
        default: "true"
      # Runner routing: empty default routes by CALLER repo visibility —
      # private repos → the org-scoped camelot-builder-pleme-eks ARC pool (avoids billed
      # hosted minutes; org runner groups refuse public repos anyway), public
      # repos → ubuntu-latest. Schedule-triggered callers (the drip tick) may
      # lack github.event.repository and fall open to hosted (documented edge).
      # Do NOT put an expression in this default — workflow_call input
      # defaults are static; the fallback lives in each job's runs-on.
      runner:
        description: "Explicit runner label override; empty = route by caller repo visibility (private → camelot-builder-pleme-eks, public → ubuntu-latest)."
        type: string
        required: false
        default: ""
    secrets:
      # required:false, deliberately. GitHub validates the WHOLE reusable call
      # graph at startup, BEFORE any job `if:` is evaluated, so a
      # `required: true` here makes every caller of the polymorphic
      # auto-release.yml fail with startup_failure and zero jobs — including
      # repos that would never reach this arm. That is the
      # union-of-required-secrets unsatisfiability this file's sibling comment
      # already names; ruby-gem was dropped as an arm for it while four arms
      # kept the same declaration. Absence is caught at publish time instead,
      # where the error can name the secret and the repo it is missing from.
      CRATES_API_TOKEN:
        required: false
        description: "Registry publish token (crates.io API token with publish scope)."
      BOT_PAT:
        required: false
        description: "Optional PAT with repo scope for cross-workflow tag triggers."

permissions:
  contents: write

# Serialize releases per repository. Two pushes to main otherwise trigger
# two bump runs from the same base; the first run's bump-commit push
# advances main, making the second run's push non-fast-forward — the second
# bump is then lost. The same group also serializes a */15 drip tick against
# a still-running push ship (which rides the rate limit for up to 30m) so
# they don't race for crates.io new-crate tokens. Queue rather than cancel:
# a release already in flight (commit + tag + publish) must finish. Only the
# ENTRY workflow's concurrency is honored by GitHub (a nested reusable call
# inherits the caller's), so the same group across the rust/cargo/polymorphic
# entrypoints is safe + gives true per-repo serialization.
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump workspace + tag
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    # Skip when the bot itself pushed (avoids tag-push → bump → tag-push loops)
    # and on the scheduled drip tick (a capacity-ride must never bump/tag).
    if: github.actor != 'github-actions[bot]' && github.event_name != 'schedule'
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      # Private git dependencies. checkout's token is scoped to THIS repo, so a
      # workspace whose members read a sibling PRIVATE pleme-io repo fails with
      # cargo's misleading "revision <sha> not found" — the fetch is denied, and
      # cargo reports the resulting empty clone as a missing rev rather than as
      # auth. escriba tripped exactly this on zenmai (private).
      #
      # cargo-auto-release.yml has carried this on bump+ship since the ~20-repo
      # private flip (2026-07-23); this workspace sibling never got it. Same fix,
      # same placement: after checkout, before anything cargo touches.
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        uses: pleme-io/actions/rust-workspace-bump@main
        with:
          bump-type: ${{ inputs.bump-type }}
          source-paths: ${{ inputs.source-paths }}

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-commit-tag@main
        with:
          version: ${{ steps.bump.outputs.new-version }}
          add-paths: ${{ inputs.add-paths }}

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-push-with-token@main
        with:
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "true"
          # PARITY with cargo-auto-release.yml:218 — this reusable was the
          # only one of the family missing it. The three lockfiles a bump
          # touches are all GENERATED, and `gen-spec` fires on the same push
          # and can finish first, so its regenerated Cargo.gen.lock lands
          # while this job is still building. Without declaring them
          # regenerable, git-push-with-token defaults to "" and ABORTS the
          # rebase on a conflict in a file no human wrote — stranding the
          # release after the tag already exists. Declaring them resolves in
          # favour of the bump, which is correct: the bump's copy is the one
          # generated against the version being released.
          regenerable-paths: "Cargo.lock Cargo.gen.lock Cargo.build-spec.json"

  ship:
    name: Ship workspace to registry
    needs: bump
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    # privacy posture 2026-07-05: private repos bump+tag only — no public
    # registry publish; see pangea-architectures PRIVACY-WAVES.md. Publishing
    # a new version from a private repo leaks code to crates.io and undoes
    # yanks. Same caller-visibility expression family as the runner routing
    # above (in a workflow_call the github context is the CALLER's run).
    # Nothing depends on this job, so a visibility-skip fails nothing downstream.
    if: needs.bump.outputs.bumped == 'true' && !github.event.repository.private
    steps:
      # Re-checkout to pick up the bumped Cargo.toml from main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      # Private git dependencies. checkout's token is scoped to THIS repo, so a
      # workspace whose members read a sibling PRIVATE pleme-io repo fails with
      # cargo's misleading "revision <sha> not found" — the fetch is denied, and
      # cargo reports the resulting empty clone as a missing rev rather than as
      # auth. escriba tripped exactly this on zenmai (private).
      #
      # cargo-auto-release.yml has carried this on bump+ship since the ~20-repo
      # private flip (2026-07-23); this workspace sibling never got it. Same fix,
      # same placement: after checkout, before anything cargo touches.
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pleme-io/actions/rust-workspace-publish@main
        with:
          no-verify: ${{ inputs.no-verify }}
          rename-prefix: ${{ inputs.rename-prefix }}
          publish-mode: full
        env:
          # Org-level secret name is CRATES_API_TOKEN; cargo reads
          # CARGO_REGISTRY_TOKEN. Bridge the names here.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}

  # Drip: a scheduled (cron) tick that publishes only what crates.io
  # capacity currently allows and defers the rest — the resume engine
  # that finishes a large new-crate bootstrap hands-off, across the
  # natural rate-limit refill, until every member is on the registry.
  # No bump, no tag; idempotent (skips already-published); a no-op in
  # seconds once the bootstrap converges, so it's safe to leave armed.
  drip:
    name: Drip-publish remaining capacity
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    # Three arms, and the third is the one that makes this job trustworthy
    # rather than opt-in:
    #
    #   schedule           — the consumer's */15 auto-drain
    #   workflow_dispatch  — operator-forced "publish what's missing now",
    #                        the resume hand-off for a backlog a cancelled or
    #                        deferred ship stranded, with no fake source
    #                        change needed to re-trigger the ship path
    #   push where bump did NOT bump — ship's complement
    #
    # The third arm was added 2026-07-30 and reverses this comment's previous
    # claim that "a plain `push` still never drips (push bumps+ships fresh
    # source instead)". That is true only when ship RUNS. When the
    # skip-detector finds no source change, ship is skipped, NOTHING asserts
    # anything about the registry, and the run reports success — the same
    # green-by-omission cargo-auto-release's drip was built to remove.
    #
    # Measured 2026-07-30 across 204 publishing members in public repos: 61
    # were never published and 2 were behind, with no red anywhere. `ishou`
    # is the clean instance — it calls this reusable, carries NO schedule, so
    # its drip had never once run, and ishou-batente/ishou-pente@0.1.4 are
    # both absent from crates.io. Requiring each consumer to remember a cron
    # is what let that sit. `tear` DOES carry the */15 schedule and its
    # members are still absent, so this arm is necessary, not sufficient —
    # that case is a separate, still-open defect.
    #
    # Safe to run on the complement: rust-workspace-publish is idempotent
    # (already-published is an explicit green) and converges to a no-op in
    # seconds. `needs: bump` + always() keeps the schedule arm alive even
    # though bump itself skips on schedule.
    #
    # privacy posture 2026-07-05: private repos bump+tag only — no public
    # registry publish; see pangea-architectures PRIVACY-WAVES.md. Documented
    # residual (same as the runner-routing edge above): schedule-triggered
    # callers may lack github.event.repository, so `!…private` falls open —
    # private repos should not carry a drip schedule in the first place.
    needs: bump
    if: >-
      always()
      && !github.event.repository.private
      && (
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (needs.bump.result == 'success' && needs.bump.outputs.bumped != 'true')
      )
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      # Private git dependencies. checkout's token is scoped to THIS repo, so a
      # workspace whose members read a sibling PRIVATE pleme-io repo fails with
      # cargo's misleading "revision <sha> not found" — the fetch is denied, and
      # cargo reports the resulting empty clone as a missing rev rather than as
      # auth. escriba tripped exactly this on zenmai (private).
      #
      # cargo-auto-release.yml has carried this on bump+ship since the ~20-repo
      # private flip (2026-07-23); this workspace sibling never got it. Same fix,
      # same placement: after checkout, before anything cargo touches.
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pleme-io/actions/rust-workspace-publish@main
        with:
          no-verify: ${{ inputs.no-verify }}
          rename-prefix: ${{ inputs.rename-prefix }}
          publish-mode: drip
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
