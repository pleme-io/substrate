name: auto-release-min
# Bisect probe: detect + caixa + unsupported only, no language arms.
# If a consumer of THIS starts, the startup_failure lives in one of the eight
# language arms. If it also fails, the cause is in detect/unsupported or the
# file's own shape.
on:
  workflow_call:
    inputs:
      bump-type:
        type: string
        required: false
        default: patch
    secrets:
      BOT_PAT:
        required: false
permissions:
  contents: write
jobs:
  detect:
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest' }}
    outputs:
      repo-type: ${{ steps.detect.outputs.repo-type }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: pleme-io/actions/detect-repo-type@main
  caixa:
    needs: detect
    if: needs.detect.outputs.repo-type == 'caixa'
    uses: pleme-io/substrate/.github/workflows/caixa-tlisp-auto-release.yml@main
    secrets: inherit
  unsupported:
    needs: detect
    if: needs.detect.outputs.repo-type != 'caixa'
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest' }}
    steps:
      - run: echo "::error::unsupported ${{ needs.detect.outputs.repo-type }}"; exit 1
