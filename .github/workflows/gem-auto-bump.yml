# Ruby gem auto-bump -- reusable composite workflow (Layer 2).
#
# Composes:
#   - pleme-io/actions/substrate-bump@main   (polymorphic — detects *.gemspec
#                                           and calls `.#gem:bump`)
#
# Consumer (.github/workflows/auto-bump.yml):
#   on: { push: { branches: [main] } }
#   jobs:
#     bump:
#       uses: pleme-io/substrate/.github/workflows/gem-auto-bump.yml@main
#       secrets:
#         # Optional: pass a PAT so the tag push triggers downstream
#         # workflows. The default GITHUB_TOKEN cannot trigger another
#         # workflow run on its own pushes (GH security restriction).
#         BOT_PAT: ${{ secrets.BOT_PAT }}
#
# Skips when the bot itself pushed, or when nothing under lib/ or the
# gemspec changed since the previous tag. Otherwise: patch-bump (or
# whatever `bump-type` says), commit, push, tag, push tag.
#
# BOT_PAT semantics:
#   - If the consumer provides BOT_PAT, checkout + push both use it,
#     which lets the tag push trigger the release workflow.
#   - If BOT_PAT is absent we fall back to GITHUB_TOKEN; the bump still
#     succeeds and the tag still lands, but the release workflow must
#     be triggered manually (`gh workflow run release.yml --ref vX.Y.Z`).

name: gem-auto-bump

on:
  workflow_call:
    inputs:
      bump-type:
        type: string
        default: patch
      runner-labels:
        description: 'JSON array of runner labels, e.g. ["self-hosted","pleme-private"]. Empty keeps the visibility-derived label.'
        type: string
        default: ''
      token-source:
        description: 'Where the job takes its GitHub token (pleme-io/actions/github-token): app (default) is the short-lived installation token the self-hosted runner host mints from the fleet App, whose tag push triggers downstream workflows; pat presents BOT_PAT; none presents nothing. Without a token GITHUB_TOKEN pushes, and that does NOT trigger downstream.'
        type: string
        default: 'app'
    secrets:
      BOT_PAT:
        required: false
        description: "Long-lived PAT, presented only when token-source is pat."

permissions:
  contents: write

jobs:
  bump:
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ inputs.runner-labels != '' && fromJSON(inputs.runner-labels) || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    if: github.actor != 'github-actions[bot]'
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}

      - id: changes
        shell: bash
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Skip when nothing under lib/ or the gemspec moved since the
          # previous tag — those are the only paths a gem-bump should react to.
          if git diff --quiet "$last" HEAD -- lib/ '*.gemspec'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - if: steps.changes.outputs.skip == 'false'
        uses: pleme-io/actions/substrate-bump@main
        with:
          bump-type: ${{ inputs.bump-type }}

      - if: steps.changes.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: pleme-io/actions
          ref: main
          path: .pleme-actions

      - if: steps.changes.outputs.skip == 'false'
        id: push-src
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/git-push-with-token.tlisp"
          cat .pleme-actions/_tlisp-stdlib/stdlib.tlisp > "$out"
          echo >> "$out"
          cat .pleme-actions/git-push-with-token/run.tlisp >> "$out"
          rm -rf .pleme-actions
          echo "script-file=$out" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.skip == 'false'
        uses: pleme-io/actions/tatara-script@main
        with:
          script-file: ${{ steps.push-src.outputs.script-file }}
        env:
          GIT_PUSH_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
          BRANCH: main
          PUSH_TAGS: "true"
