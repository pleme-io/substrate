# Ruby gem CI -- reusable composite workflow (Layer 2).
#
# Composes:
#   - pleme-io/actions/nix-flake-check@main
#
# Consumer (.github/workflows/ci.yml):
#   on: [push, pull_request]
#   jobs:
#     check:
#       uses: pleme-io/substrate/.github/workflows/gem-ci.yml@main
#
# Runs `nix flake check`, which builds `checks.<system>.*` and NOTHING else
# — it merely *evaluates* packages/devShells/apps and prints
# `(build skipped)`. The previous version of this header said it "runs
# whatever checks the consumer's flake exposes. For most pangea-* gems that
# means rspec via the `.#test` app", which is two claims and both are wrong:
# `nix flake check` never runs an app, and `ruby-gem-flake.nix` emits no
# `checks` output at all. On a gem flake this command is therefore a pure
# EVALUATION check. Read substrate's CLAUDE.md section
# "`nix flake check` BUILDS ONLY `checks.<system>.*`" before treating a green
# run here as test coverage.
#
# ── PRIVATE FLAKE INPUTS NEED A TOKEN (wired 2026-08-02) ────────────────
#
# nix's GitHub fetcher runs ANONYMOUS unless given one, and GitHub answers
# 404 — not 403 — for a private repo, so the failure reads as "this revision
# does not exist" when the revision exists fine and the request was simply
# unauthenticated. Do not chase a stale pin.
#
# Measured on pangea-architectures the first time its CI ever ran
# (2026-08-02, run after 87e6666 enabled Actions):
#
#   error: unable to download
#     'https://api.github.com/repos/pleme-io/ami-forge/tarball/18f4ce9b…':
#     HTTP error 404
#
# `pleme-io/ami-forge` is declared private in org.yaml, and the rev resolves
# fine with credentials. This is the same mechanism cargo-ci.yml documents at
# length for the Rust side; the Ruby reusable never got the wiring, so every
# gem flake with a private input has been unable to pass this job.
#
# BOT_PAT first. The fallback is a courtesy, not a fix: the auto-provided
# GITHUB_TOKEN is scoped to the RUNNING repo, so it cannot read a DIFFERENT
# private repo and will still 404 — it only buys the authenticated rate limit
# for public inputs. A consumer with private inputs must pass `secrets: inherit`
# AND have BOT_PAT set at the org; if this still 404s, that org secret is the
# thing to check.

name: gem-ci

on:
  workflow_call:
    inputs:
      runner-labels:
        description: 'JSON array of runner labels, e.g. ["self-hosted","pleme-private"]. Empty keeps the visibility-derived label.'
        type: string
        default: ''
      token-source:
        description: 'Where the job takes its GitHub token (pleme-io/actions/github-token): app (default) is the short-lived installation token the self-hosted runner host mints from the fleet App, absent on hosted runners, where GITHUB_TOKEN is presented instead; pat presents BOT_PAT; none presents nothing.'
        type: string
        default: 'app'
    secrets:
      BOT_PAT:
        description: "Long-lived PAT, presented only when token-source is pat."
        required: false

jobs:
  check:
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ inputs.runner-labels != '' && fromJSON(inputs.runner-labels) || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/nix-flake-check@main
        with:
          github-token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
