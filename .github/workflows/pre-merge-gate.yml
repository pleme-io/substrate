name: pre-merge-gate

# Comprehensive PR-time quality gate. Detects repo type +
# dispatches to the right per-language gate AND runs the
# universal verifiers (auto-release-verify dry-run, tlisp-lint
# when applicable).
#
# Consumer (.github/workflows/pre-merge-gate.yml):
#   on:
#     pull_request:
#       branches: [main]
#   jobs:
#     gate:
#       uses: pleme-io/substrate/.github/workflows/pre-merge-gate.yml@main
#       secrets: inherit
#
# Bundles:
#   detect-repo-type     → routes to per-language gate
#   <lang>-gate          → fmt + lint + test for the repo's language
#   auto-release-verify  → dry-run the publish (catches metadata bugs)
#   tlisp-lint           → paren/balance check (when *.tlisp files exist)
#
# Each gate runs independently; PR fails if any gate fails. No
# cascading short-circuit so the operator sees all problems at once.

on:
  workflow_call:
    inputs:
      run-rust-gate:
        type: string
        required: false
        default: "true"
      run-npm-gate:
        type: string
        required: false
        default: "true"
      run-python-gate:
        type: string
        required: false
        default: "true"
      run-tlisp-lint:
        type: string
        required: false
        default: "true"
      run-workflow-shim-lint:
        description: >-
          Report workflow files that are hand-authored instead of shims over a
          catalogued substrate reusable. Reports only — it does not fail the
          gate yet (see the job below for why and for the end state).
        type: string
        required: false
        default: "true"
      run-publishability-lint:
        description: >-
          Report a NEW disclosure of somebody else's estate — an AWS account id,
          a live resource id, a cloud endpoint host — in a repo that is public
          or about to be. Reports only for now (see the job below).
        type: string
        required: false
        default: "true"
      run-publish-verify:
        type: string
        required: false
        default: "true"
      # Runner routing: empty default routes by CALLER repo visibility —
      # private repos → the pleme-io-org self-hosted ARC pool (vars.PRIVATE_BUILDER_RUNNER)
      # (avoids billed hosted minutes), public repos → ubuntu-latest. Keyed
      # off github.event.repository.private (the caller's event payload),
      # never an org-level Actions variable — pleme-io's GitHub Free org
      # plan doesn't share org vars/secrets into private repos' workflow
      # context. Same idiom as rust-auto-release.yml/python-auto-release.yml.
      runner:
        type: string
        required: false
        default: ""
    secrets:
      CRATES_API_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      PYPI_API_TOKEN:
        required: false
      BOT_PAT:
        required: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect repo type
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    outputs:
      repo-type: ${{ steps.detect.outputs.repo-type }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: pleme-io/actions/detect-repo-type@main

  rust-quality:
    name: 'rust · fmt + clippy + test'
    needs: detect
    if: |
      inputs.run-rust-gate == 'true' &&
      (needs.detect.outputs.repo-type == 'rust-workspace' ||
       needs.detect.outputs.repo-type == 'rust-single-crate')
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/rust-gate@main

  npm-quality:
    name: 'npm · fmt + lint + test'
    needs: detect
    if: inputs.run-npm-gate == 'true' && needs.detect.outputs.repo-type == 'npm'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/npm-gate@main

  python-quality:
    name: 'python · fmt + lint + test'
    needs: detect
    if: inputs.run-python-gate == 'true' && needs.detect.outputs.repo-type == 'python'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/python-gate@main

  tlisp-balance:
    name: 'universal · tlisp-lint'
    needs: detect
    if: inputs.run-tlisp-lint == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/tlisp-lint@main
        with:
          fail-on-unbalanced: "true"

  action-shell-ban:
    name: 'universal · action-shell-lint (★★ NO-SHELL)'
    needs: detect
    if: needs.detect.outputs.repo-type == 'github-action'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/action-shell-lint@main
        with:
          threshold: "15"
          fail-on-violation: "true"

  workflow-shim:
    name: 'universal · workflow-shim-lint (CATALOG REFLECTION)'
    needs: detect
    if: inputs.run-workflow-shim-lint == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      # `fail-on-violation` is FALSE on purpose, and temporarily.
      #
      # Measured 2026-08-04: 144 hand-authored workflows across 99
      # pleme-io-authored repos (a further 176 live in vendored upstream forks
      # and are out of scope). Failing today would red 99 repos at once for a
      # backlog they did not create, and the reliable result of that is people
      # learning to ignore the gate rather than convert anything.
      #
      # So this reports, loudly, in the 169 repos that already call
      # pre-merge-gate — which is how the backlog becomes visible where the
      # work happens instead of in a one-off audit. The end state is
      # `fail-on-violation: "true"`, once those 144 are converted or carry a
      # typed `# skip-workflow-shim: <reason>` waiver.
      #
      # TIER while this reads false: only-mitigated. Not a gate yet, and it
      # should not be described as one.
      - uses: pleme-io/actions/workflow-shim-lint@main
        with:
          fail-on-violation: "false"

  publishability:
    name: 'universal · publishability-lint (no borrowed estate)'
    needs: detect
    if: inputs.run-publishability-lint == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      # `fail-on-violation` is FALSE for the first sweep, on purpose.
      #
      # Measured 2026-08-17: a sweep found customer-identifying content in 25
      # public repos — account ids, tenant names, a partner registry, internal
      # GitOps paths, a live incident postmortem. All of it was cleaned that
      # day, so the expected steady state here is zero. But this gate also
      # carries rule classes the sweep did not use, so the first fleet-wide run
      # is a survey, and turning it red before anyone has seen its output is how
      # a gate earns a reputation for noise and then gets switched off.
      #
      # Flip to "true" once a full cycle across the callers reports clean, or
      # once the findings that do surface are baselined with a reason. Unlike
      # the shim lint above, this one has no known backlog to work through —
      # so the window should be short.
      #
      # TIER while this reads false: only-mitigated. It reports; it does not
      # gate. Do not describe it as a gate until the flag flips.
      - uses: pleme-io/actions/publishability-lint@main
        with:
          fail-on-violation: "false"

  publish-dry-run:
    name: 'universal · auto-release-verify'
    needs: detect
    if: inputs.run-publish-verify == 'true' && needs.detect.outputs.repo-type != 'unknown'
    uses: pleme-io/substrate/.github/workflows/auto-release-verify.yml@main
    secrets:
      CRATES_API_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
