name: auto-bump

# Self-bump for the pleme-io/substrate repo. Substrate hosts the
# canonical reusable workflows that the fleet's auto-release.yml
# consumers reference. Tagging each push gives consumers a way
# to pin a substrate revision when they want stability over
# 'always-latest @main'.
#
# ── ABSORBED 2026-08-19 ──────────────────────────────────────────
# The "mirrors pleme-io/actions/.github/workflows/auto-bump.yml —
# same pattern, different repo" note that used to sit here was the
# evidence: the same shape existed in three repos. It is now
# pleme-io/actions/next-tag, and this file calls it.
#
# The replaced shell also had no guards. git-commit-tag refuses a
# tag that is not above the highest released version, and refuses
# one that already exists.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute the next tag from content changes
        id: next
        uses: pleme-io/actions/next-tag@main
        with:
          bump-type: ${{ inputs.bump-type || 'patch' }}
          source-paths: ".github/workflows lib docs"

      - name: Tag
        if: steps.next.outputs.skip == 'false'
        uses: pleme-io/actions/git-commit-tag@main
        with:
          version: ${{ steps.next.outputs.version }}
          commit-message-template: "release: pleme-io/substrate {tag}"

      - name: Push the tag
        if: steps.next.outputs.skip == 'false'
        uses: pleme-io/actions/git-push-with-token@main
        with:
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          push-tags: "true"
