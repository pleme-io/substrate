# Reusable workflow: publish a pure-tatara-lisp caixa (Biblioteca,
# Binario, or Servico whose module.source uses the github: URL grammar).
#
# Differs from caixa-publish.yml in that:
#   - no OCI image is built / pushed (the runtime resolves source via
#     git URL, per theory/WASM-PACKAGING.md §II)
#   - publishing == git tag + push (Zig-style), nothing more
#   - cse-lint + feira lint still gate the tag
#
# Use this when the caixa is pure Lisp source (.tlisp files) consumed
# by tatara-script or by the wasm-engine via github: source URLs.
#
# Consumer (e.g. pleme-io/programs):
#   jobs:
#     release:
#       uses: pleme-io/substrate/.github/workflows/caixa-publish-tlisp.yml@main
#       secrets: inherit
#       permissions:
#         contents: write

name: caixa-publish-tlisp

on:
  workflow_call:
    inputs:
      caixaPath:
        description: "Path inside repo where the caixa.lisp lives. Default: repo root."
        type: string
        default: "."
      tagPrefix:
        description: "Git tag prefix for the version"
        type: string
        default: "v"
      runner:
        description: "Runner label"
        type: string
        default: "ubuntu-24.04"

jobs:
  publish:
    name: Publish tlisp caixa
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}
      - name: Parse caixa.lisp
        id: meta
        env:
          REPO: ${{ github.repository }}
          PREFIX: ${{ inputs.tagPrefix }}
          PATH_IN_REPO: ${{ inputs.caixaPath }}
        run: |
          set -euo pipefail
          manifest="${PATH_IN_REPO}/caixa.lisp"
          if [ ! -f "$manifest" ]; then
            echo "::error::caixa.lisp not found at ${manifest}"
            exit 1
          fi
          versao=$(awk '/:versao/{ if (match($0, /"[^"]*"/)) { print substr($0, RSTART+1, RLENGTH-2); exit } }' "$manifest")
          nome=$(awk '/:nome/{ if (match($0, /"[^"]*"/)) { print substr($0, RSTART+1, RLENGTH-2); exit } }' "$manifest")
          if [ -z "$versao" ] || [ -z "$nome" ]; then
            echo "::error::could not parse :versao or :nome from $manifest"
            exit 1
          fi
          tag="${PREFIX}${versao}"
          {
            echo "nome=$nome"
            echo "versao=$versao"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::caixa $nome v$versao → tag=$tag"

      - name: cse-lint repo
        run: |
          set -euo pipefail
          # HARD GATE as of 2026-07-28. A violation fails the job and no
          # tag is pushed.
          #
          # The `|| echo "::warning::"` it replaces cited a "migration
          # window" that named no end condition and no date — so there
          # was nothing that could ever be observed to close, and the
          # softness had no expiry. A verdict computed and discarded on
          # the publish path is not a gate (★★ UNREPRESENTABILITY tier
          # ⊥, "discarded" subclass).
          #
          # Blast radius at the time of the change: this workflow has
          # ZERO callers fleet-wide, so nothing goes red on landing and
          # the first adopter starts hard rather than inheriting a
          # softness it would then have to be argued out of.
          nix run github:pleme-io/cse-lint -- repo "${{ inputs.caixaPath }}" --strict

      # Dialect gate — see caixa-validate.yml's header for the measurement.
      # `defcaixa` was spoken by two unrelated declarations; 249 of 270
      # manifests across the org checkout were the foreign one on
      # 2026-07-31, and no gate anywhere said so.
      - name: feira dialeto
        run: |
          set -euo pipefail
          cd "${{ inputs.caixaPath }}"
          nix run github:pleme-io/caixa#feira -- dialeto .

      # HARD as of 2026-07-31, for the same reason the cse-lint step above
      # was hardened three days earlier: the `|| echo "::warning::"` it
      # replaces reported "unavailable" for BOTH a missing app and a real
      # violation, so a genuine failure rendered as an infrastructure
      # excuse on the path that pushes a git tag.
      - name: feira lint
        run: |
          set -euo pipefail
          cd "${{ inputs.caixaPath }}"
          nix run github:pleme-io/caixa#feira -- lint

      - name: Tag + push v<versao>
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NOME: ${{ steps.meta.outputs.nome }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists; skipping git tag step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "caixa $NOME $TAG"
          git push origin "$TAG"
          echo "::notice::Tagged + pushed $TAG"
