# Reusable workflow: run every chart's `helm unittest` suites, plus `helm lint`.
#
# Usage (from a consumer repo):
#
#   jobs:
#     charts:
#       uses: pleme-io/substrate/.github/workflows/helm-unittest.yml@main
#       with:
#         chartsDir: charts            # default
#         chartsWithTestsFloor: 7      # coverage floor, see below
#         lintFailureCeiling: 0        # ratchet, see below
#
# ── Why this exists ──────────────────────────────────────────────────────
# Measured 2026-08-11: substrate carried five `helm-*` reusables — publish,
# auto-release, monorepo-auto-release, chart-release and the family
# composer — and not one of them RUNS A CHART'S TESTS. helmworks, which
# holds every authored chart in the fleet under ★★ HELM-NATIVE, had a
# single workflow (auto-release.yml). So a chart could ship a complete
# helm-unittest suite and nothing would ever execute it.
#
# That is the "a check nobody builds enforces nothing" class, and it is
# worth naming precisely because it is invisible from inside the repo:
# `helm unittest .` passes on a laptop, the suite sits in git, the chart
# releases green, and the assertions have never once run in CI.
#
# ── `helm dependency update` is not optional ─────────────────────────────
# A chart depending on a `file://` library chart does not lint until its
# dependency is materialised — the include resolves to
# `no template "pleme-lib.labels" associated with template "gotpl"`, which
# reads like a broken chart and is not. Measured on helmworks: 25 of 148
# charts "failed" lint for exactly this reason and zero were actually
# broken. Skipping this step would have produced a 25-failure red wall on
# day one and got the whole workflow disabled.
#
# ── Two bounds, because they fail differently ────────────────────────────
# `chartsWithTestsFloor` guards COVERAGE. A discovery-driven job that finds
# nothing is the same shape as the problem it exists to solve: it exits 0
# and reads as "all charts pass". Set the floor below today's count
# (roughly half) so adding a suite never demands an edit here, while a repo
# that silently loses most of them still fails.
#
# `lintFailureCeiling` is a RATCHET, not a floor. It exists so this can be
# adopted by a repo with pre-existing lint debt without either blocking on
# a cleanup or quietly ignoring lint forever: today's count goes in, the
# number may only come down, and a NEW lint break fails the job. Test
# failures are never ratcheted — they gate at zero, always.

name: helm-unittest

on:
  workflow_call:
    inputs:
      chartsDir:
        description: "Directory containing chart directories, relative to the repo root"
        type: string
        default: "charts"
      chartsWithTestsFloor:
        description: >
          Minimum number of charts that must carry a `tests/` suite. Guards
          against a silent coverage collapse — a moved directory or a renamed
          tests/ folder otherwise turns this job into a green no-op.
        type: number
        default: 1
      lintFailureCeiling:
        description: >
          Maximum tolerated `helm lint` failures. A ratchet for adopting this
          in a repo with existing lint debt: set today's count, and the number
          may only go down. Test failures are NOT covered by this and always
          gate at zero.
        type: number
        default: 0
      externalTestsDir:
        description: >
          OPTIONAL second suite tree, relative to the repo root, laid out as
          <externalTestsDir>/<chartName>/*_test.yaml. Empty (the default) means
          only in-chart `<chart>/tests` is scanned, which is what every consumer
          got before this input existed.

          Why it exists: this job globs `<chartsDir>/*/tests` and nothing else,
          so a repo that keeps suites OUTSIDE its chart directories has them
          silently unscanned while this job reports green. Measured in helmworks
          2026-08-19: 176 *_test.yaml files, 1178 assertions across 43 chart
          directories, in `tests/` — invisible here, and reachable only through
          flake apps that no workflow invokes. `chartsWithTestsFloor` cannot
          catch that: the floor counts charts carrying an IN-CHART tests/ dir,
          so a repo with zero external coverage and a healthy in-chart count
          looks identical to one with both.
        type: string
        default: ""
      fixtureChartsDir:
        description: >
          Directory of SELF-CONTAINED FIXTURE CHARTS, relative to the repo root.
          Each immediate subdirectory is a chart run with
          `helm unittest -f '*_test.yaml' <chart>`.

          WHY THIS EXISTS, and it is not a convenience. A Helm LIBRARY chart
          (`type: library`) renders nothing on its own, so `helm unittest` over
          `chartsDir` can never reach it — the only way to exercise a named
          template is a bare consumer chart that includes it. Such a chart is
          not a member of `chartsDir` (it must never publish) and its name is
          not a chart name, so `externalTestsDir` cannot reach it either.

          Measured on helmworks 2026-08-29: a fixture chart carrying 191
          passing tests AND one failing one had never been executed by CI, in a
          repo whose own workflow header warns about exactly that. Empty (the
          default) disables the pass entirely.
        type: string
        default: ""
      fixtureChartsFloor:
        description: >
          Minimum fixture charts that must be discovered when fixtureChartsDir
          is set. Same anti-vacuity role as chartsWithTestsFloor: a directory
          that stops matching yields zero failures, which is indistinguishable
          from everything passing.
        type: number
        default: 1
      runner:
        description: "Runner label"
        type: string
        default: "ubuntu-24.04"

jobs:
  unittest:
    name: helm lint + unittest
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # ── THE PAIR IS A CONTRACT, NOT TWO INDEPENDENT PINS ────────────────
      #
      # helm-unittest >= 1.1.0 emits `platformHooks` in its plugin.yaml, and
      # helm's plugin loader rejects unknown fields. `platformHooks` first
      # appears in helm at v3.18.0 — measured, not assumed: `pkg/plugin/plugin.go`
      # has 0 occurrences at v3.16.3 and v3.17.3, and 3 at v3.18.0 / v3.19.1.
      #
      # The previous pair (helm v3.16.3 × helm-unittest 1.1.1) straddled that
      # boundary in the one direction that cannot work, so this workflow died at
      # `helm plugin install` — step 3 of 5, before a single chart was read — on
      # every run since it was authored. It was born red and shipped unexecuted:
      # 22/22 failures across two substrate revisions, identical text each time.
      #
      # These two values are the pair nixpkgs resolves at the rev substrate,
      # helmworks and ensaio all lock — MEASURED, because the first attempt at
      # this fix pinned 3.19.1/1.0.3 on a second-hand claim and that pair, while
      # internally consistent, is NOT what a developer gets:
      #
      #   nix eval ... "helm=${p.kubernetes-helm.version} \
      #                 unittest=${p.kubernetes-helmPlugins.helm-unittest.version}"
      #   => helm=3.20.2 unittest=1.1.0
      #
      # So CI now runs what a developer already runs. That equality is the whole
      # point — it is why "measured 0 lint failures" claims made on a laptop were
      # never reproducible here. Note this pair is modern on BOTH sides
      # (helm-unittest 1.1.0 emits platformHooks; helm 3.20.2 accepts it), which
      # is also the direction that does not strand the plugin on an old line.
      #
      # DESTINATION: source both from the flake rather than downloading a
      # hardcoded version, so the pair cannot drift apart again by editing one
      # line — and so this comment cannot go stale the next time nixpkgs moves.
      # `pending-helm-pair-from-flake`.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.0

      - name: Lint and test every chart
        env:
          CHARTS_DIR: ${{ inputs.chartsDir }}
          TESTS_FLOOR: ${{ inputs.chartsWithTestsFloor }}
          LINT_CEILING: ${{ inputs.lintFailureCeiling }}
          EXTERNAL_TESTS_DIR: ${{ inputs.externalTestsDir }}
          FIXTURE_CHARTS_DIR: ${{ inputs.fixtureChartsDir }}
          FIXTURE_FLOOR: ${{ inputs.fixtureChartsFloor }}
        run: |
          set -uo pipefail
          if [ ! -d "$CHARTS_DIR" ]; then
            echo "::error::chartsDir '$CHARTS_DIR' does not exist — this job would scan nothing and pass"
            exit 1
          fi

          scanned=0; linted=0; lint_failed=0; tested=0; ext_tested=0; test_failed=0
          for chart in "$CHARTS_DIR"/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            scanned=$((scanned + 1))
            name=$(basename "$chart")

            # Materialise file:// library-chart deps, or every include
            # through them lints as a missing template.
            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency update "$chart" >/dev/null 2>&1 || true
            fi

            if helm lint "$chart" >/tmp/lint.log 2>&1; then
              linted=$((linted + 1))
            else
              lint_failed=$((lint_failed + 1))
              echo "::warning title=helm lint failed::$name"
              sed -n '1,10p' /tmp/lint.log
            fi

            # A chart with no suite is not a failure — most charts have
            # none — but it is not a pass either, which is what the counts
            # below keep visible.
            if [ -d "${chart}tests" ]; then
              tested=$((tested + 1))
              if ! helm unittest "$chart"; then
                echo "::error title=helm unittest failed::$name"
                test_failed=$((test_failed + 1))
              fi
            fi

            # The OPTIONAL second suite tree. Counted separately from `tested`
            # so the denominator stays honest: a repo can have in-chart suites,
            # external suites, both or neither, and the summary line must be
            # able to say which. `-f` is resolved relative to the CHART dir,
            # hence the ../.. climb back to the repo root.
            if [ -n "$EXTERNAL_TESTS_DIR" ] && [ -d "$EXTERNAL_TESTS_DIR/$name" ]; then
              ext_tested=$((ext_tested + 1))
              if ! helm unittest -f "../../$EXTERNAL_TESTS_DIR/$name/*_test.yaml" "$chart"; then
                echo "::error title=helm unittest failed (external suite)::$name"
                test_failed=$((test_failed + 1))
              fi
            fi
          done

          # ── FIXTURE CHARTS ──────────────────────────────────────────────
          # A library chart renders nothing, so the loop above cannot reach one.
          # These are bare consumer charts that exist only to exercise named
          # templates; they are counted SEPARATELY so the summary can say which
          # kind of coverage ran, and they are never published.
          fixtures=0
          if [ -n "$FIXTURE_CHARTS_DIR" ]; then
            for fx in "$FIXTURE_CHARTS_DIR"/*/; do
              [ -f "${fx}Chart.yaml" ] || continue
              fixtures=$((fixtures + 1))
              fname=$(basename "$fx")
              if grep -q '^dependencies:' "${fx}Chart.yaml"; then
                helm dependency update "$fx" >/dev/null 2>&1 || true
              fi
              # -f because a fixture keeps its suites at the chart ROOT rather
              # than in tests/ — that is the existing on-disk layout, and
              # relocating N suites to satisfy a discovery default would be a
              # bigger change than teaching discovery the layout.
              if ! helm unittest -f '*_test.yaml' "$fx"; then
                echo "::error title=helm unittest failed (fixture chart)::$fname"
                test_failed=$((test_failed + 1))
              fi
            done
          fi

          echo "scanned=$scanned linted=$linted lint_failed=$lint_failed with-suites=$tested ext-suites=$ext_tested fixtures=$fixtures test_failed=$test_failed"

          # ANTI-VACUITY for the fixture tree. A consumer that set the input has
          # asserted the tree exists; finding nothing means the path is wrong or
          # the layout is not <dir>/<chart>/Chart.yaml, and running nothing while
          # reporting success is the exact failure this input was added to end.
          if [ -n "$FIXTURE_CHARTS_DIR" ] && [ "$fixtures" -lt "$FIXTURE_FLOOR" ]; then
            echo "::error::found $fixtures fixture chart(s) under '$FIXTURE_CHARTS_DIR', below the floor of $FIXTURE_FLOOR — the path is wrong, the layout is not <dir>/<chart>/Chart.yaml, or fixtures were lost"
            exit 1
          fi

          # ANTI-VACUITY for the external tree, same discipline as the scanned=0
          # guard below. A consumer that sets externalTestsDir has asserted the
          # tree exists; matching ZERO chart names means the path is wrong or the
          # layout is not <dir>/<chartName>/, and silently running nothing is the
          # exact failure this input was added to end.
          if [ -n "$EXTERNAL_TESTS_DIR" ] && [ "$ext_tested" -eq 0 ]; then
            echo "::error::externalTestsDir '$EXTERNAL_TESTS_DIR' matched NO chart names under '$CHARTS_DIR' — expected <dir>/<chartName>/*_test.yaml. Nothing external was verified, so a pass here would mean nothing."
            exit 1
          fi

          # THE DENOMINATOR. Without it, a wrong chartsDir, a moved tree or
          # a glob that stops matching all yield "0 failures" — which is
          # indistinguishable from every chart passing.
          if [ "$scanned" -eq 0 ]; then
            echo "::error::scanned 0 charts under '$CHARTS_DIR' — nothing was verified, so a pass here would mean nothing"
            exit 1
          fi
          if [ "$tested" -lt "$TESTS_FLOOR" ]; then
            echo "::error::only $tested chart(s) carry a tests/ suite, below the floor of $TESTS_FLOOR — suites were lost, or the floor is wrong"
            exit 1
          fi
          if [ "$lint_failed" -gt "$LINT_CEILING" ]; then
            echo "::error::$lint_failed chart(s) failed helm lint, above the ceiling of $LINT_CEILING. The ceiling is a ratchet: lower it as charts are fixed, never raise it to make a new break pass."
            exit 1
          fi
          if [ "$test_failed" -gt 0 ]; then
            echo "::error::$test_failed chart(s) failed helm unittest — never ratcheted, these gate at zero"
            exit 1
          fi
