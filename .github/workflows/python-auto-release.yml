name: python-auto-release

# Reusable workflow: on push to main, bump a Python package's
# version via uv, commit, tag, push, publish to pypi.org.

on:
  workflow_call:
    inputs:
      bump-type:
        type: string
        required: false
        default: patch
      source-paths:
        type: string
        required: false
        default: "src pyproject.toml uv.lock"
      add-paths:
        type: string
        required: false
        default: "pyproject.toml uv.lock"
      # THE RISK HERE IS DISCLOSURE, NOT MERELY CONSISTENCY. `python-publish`
      # runs `uv build` then `uv publish` to pypi.org, and `uv build` emits an
      # SDIST — a source tarball. So a private repo reaching the ship job below
      # uploads its own source to a public index, and PyPI has no unpublish:
      # a release can be yanked (hidden from resolution) but its files stay
      # downloadable, and the (name, version) pair is burned forever. That is
      # strictly worse than the git-tag-only shape some sibling workflows have,
      # where a private repo simply cannot be fetched by a public proxy and
      # nothing leaks.
      publish-from-private:
        description: >-
          Publish even though the repository is private. Default false: a private
          repo publishing to a public registry ships its source there, and a
          registry publish cannot be withdrawn, only yanked. Set true only where
          a private source deliberately produces a public artifact.
        type: string
        required: false
        default: "false"
      # Runner routing: empty default routes by CALLER repo visibility —
      # private repos → the org-scoped camelot-builder-pleme-eks ARC pool (avoids billed
      # hosted minutes; org runner groups refuse public repos anyway), public
      # repos → ubuntu-latest. Schedule-triggered callers may lack
      # github.event.repository and fall open to hosted (documented edge).
      # Do NOT put an expression in this default — workflow_call input
      # defaults are static; the fallback lives in each job's runs-on.
      runner:
        description: "Explicit runner label override; empty = route by caller repo visibility (private → camelot-builder-pleme-eks, public → ubuntu-latest)."
        type: string
        required: false
        default: ""
    secrets:
      # required:false, deliberately. GitHub validates the WHOLE reusable call
      # graph at startup, BEFORE any job `if:` is evaluated, so a
      # `required: true` here makes every caller of the polymorphic
      # auto-release.yml fail with startup_failure and zero jobs — including
      # repos that would never reach this arm. That is the
      # union-of-required-secrets unsatisfiability this file's sibling comment
      # already names; ruby-gem was dropped as an arm for it while four arms
      # kept the same declaration. Absence is caught at publish time instead,
      # where the error can name the secret and the repo it is missing from.
      PYPI_API_TOKEN:
        required: false
      BOT_PAT:
        required: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    if: github.actor != 'github-actions[bot]'
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-version: ${{ steps.bump.outputs.new-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - id: bump
        uses: pleme-io/actions/python-bump@main
        with:
          bump-type: ${{ inputs.bump-type }}
          source-paths: ${{ inputs.source-paths }}

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-commit-tag@main
        with:
          version: ${{ steps.bump.outputs.new-version }}
          add-paths: ${{ inputs.add-paths }}

      - if: steps.bump.outputs.bumped == 'true'
        uses: pleme-io/actions/git-push-with-token@main
        with:
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "true"

  ship:
    needs: bump
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    # The privacy guard, with its escape hatch. A bare `&& !private` would have
    # converted 69 private callers to silently-not-publishing — the exact defect
    # this guard family exists to remove (graphql-synthesizer, 2026-08-08:
    # cargo-auto-release reported SUCCESS, bumped, tagged, pushed, published
    # nothing, and no surface said so). Two things keep this honest: the opt-in
    # below, for a private source that deliberately produces a public artifact,
    # and the `publish-withheld` job, which turns the withheld case from an
    # absence into a statement.
    if: >-
      needs.bump.outputs.bumped == 'true'
      && (!github.event.repository.private || inputs.publish-from-private == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - uses: pleme-io/actions/python-publish@main
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # The complement of `ship`'s guard, and the whole reason adding the guard is
  # safe: it runs PRECISELY when the guard withholds, so a withheld publish is
  # an announcement rather than a missing job nobody notices.
  #
  # `always()` lifts this job out of the skipped-because-my-dependency-skipped
  # rule. Be precise about what that buys HERE, because the usual reason does
  # not apply: the shared `bumped == 'true'` precondition already implies `bump`
  # ran, so the skipped-upstream case is excluded by the condition itself. What
  # always() actually covers is `bump` FAILING AFTER setting its output — the
  # bump step succeeds, a later step (commit/tag/push) fails, `bumped` is still
  # 'true' and `needs.bump.result` is 'failure'. Without always() the notice
  # would vanish in exactly that run. It is kept for the same reason
  # cargo-auto-release's drip job keeps it: a complement job that can be
  # suppressed by its own dependency's status is back to being an absence.
  #
  # The positive precondition is kept byte-identical to ship's, so the two
  # conditions partition the bumped case exactly: at most one of
  # ship/publish-withheld selects, and when a bump happened exactly one does.
  publish-withheld:
    name: 'publish withheld (private repo)'
    needs: bump
    if: >-
      always()
      && needs.bump.outputs.bumped == 'true'
      && github.event.repository.private
      && inputs.publish-from-private != 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    steps:
      # Summary through the typed action; only the one-line ::notice stays
      # inline, since GitHub exposes no action for annotations. Note
      # step-summary-publish was a STUB when this job was written (a ::warning
      # and exit 0, writing nothing) — it was implemented first, because
      # converting to it beforehand would have deleted this notice silently.
      - uses: pleme-io/actions/step-summary-publish@main
        with:
          template: |
            ### Publish withheld

            Repository is private; nothing was published to {{registry}}.
            Bump and tag still happened.

            If this repo is meant to publish, set `publish-from-private: true`.
          vars: '{"registry":"pypi.org"}'
      # Block scalar because the message contains ": " and a plain YAML scalar
      # would parse as a mapping. Still one line of shell.
      - shell: bash
        run: |
          echo "::notice title=Publish withheld::This repository is private, so the Python package was NOT published to pypi.org. The version was bumped and tagged. Set publish-from-private: true if this repo is meant to publish a public artifact from private source."
