# reusable-gen-spec — fleet-wide gen build-spec + Cargo.gen.lock maintenance.
#
# The spread engine for the Cargo.gen.lock slim-delta migration. Any Rust
# repo adopts it with a thin caller:
#
#   # .github/workflows/gen-spec.yml
#   name: gen-spec
#   on:
#     push: { branches: [main], paths: ["**/Cargo.toml", "**/Cargo.lock"] }
#     pull_request: { paths: ["**/Cargo.toml", "**/Cargo.lock"] }
#   jobs:
#     gen-spec:
#       uses: pleme-io/substrate/.github/workflows/reusable-gen-spec.yml@main
#       secrets: inherit
#
# Mechanism (conditional logic in Rust, not shell):
#   `gen build . --commit` regenerates BOTH the committed full
#   `Cargo.build-spec.json` AND the slim `Cargo.gen.lock` delta (the
#   producer emits both since gen-cargo P1), atomically committing if
#   drifted (gen-spec-bot identity), no-op when fresh.
#
#   - push to main : regen + commit + push back via the typed action.
#   - pull request : regen without commit; fail the PR if either artifact
#                    drifted (author must include the regen commit).
#
# Uses PUBLISHED gen (`nix run github:pleme-io/gen`) — NOT a from-source
# build — so it works in any consumer repo, not just gen itself.
# substrate's lockfile-builder consumes the committed Cargo.gen.lock as the
# highest-priority spec source (delta > build-spec > IFD), so adopting this
# workflow is what eliminates eval-time IFD for the repo.
name: reusable-gen-spec

on:
  workflow_call:
    inputs:
      gen-ref:
        description: "gen flake ref to run (pin for reproducibility)."
        type: string
        default: "github:pleme-io/gen"
      # Runner routing: empty default routes by CALLER repo visibility —
      # private repos → the pleme-io-org camelot-builder-pleme-eks ARC pool
      # (avoids billed hosted minutes), public repos → ubuntu-latest. Keyed
      # off github.event.repository.private (the caller's event payload),
      # never an org-level Actions variable — pleme-io's GitHub Free org
      # plan doesn't share org vars/secrets into private repos' workflow
      # context. Same idiom as rust-auto-release.yml/python-auto-release.yml.
      runner:
        type: string
        default: ""

concurrency:
  group: gen-spec-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gen-spec:
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && 'camelot-builder-pleme-eks' || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # `gen build` shells to `cargo metadata`, which resolves EVERY git
      # dependency — and checkout's token is scoped to THIS repo only, so a
      # sibling PRIVATE pleme-io dep (≈20 flipped private 2026-07-23) fails
      # with "failed to authenticate when downloading repository". The action
      # owns the BOT_PAT > GITHUB_TOKEN order and the checkout-extraheader
      # unset that makes the rewrite actually take effect.
      - uses: pleme-io/actions/git-credentials@main
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ secrets.BOT_PAT }}
      # use-flakehub: false — no FlakeHub account; the default attempts
      # FlakeHub auth and emits a red-herring ##[error] in every run.
      # The native GitHub Actions cache half is what we want.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      # DELTA-ONLY: the committed artifact is the slim Cargo.gen.lock.
      # gen build regenerates it (and a gitignored Cargo.build-spec.json
      # intermediate). On main: --commit retires build-spec + commits the
      # delta as gen-spec-bot (no-op when fresh). On PR: regen only.
      #
      # `gen build` shells out to the literal `cargo metadata` binary (not a
      # Nix-mediated call), which GitHub-hosted runners carry pre-installed
      # but the `camelot-builder-pleme-eks` self-hosted pool this job
      # defaults to for private repos (line 60 above) does not — confirmed
      # live: every private-repo run here fails
      # "failed to start `cargo metadata`: No such file or directory".
      # `nix shell nixpkgs#cargo` supplies it hermetically, identically on
      # every runner regardless of what it ships with.
      # FAKE-GREEN FIX: a `workflow_dispatch` matched NEITHER this gate nor
      # the pull_request one below, so every regen + gate + push step
      # skipped and the job reported SUCCESS having done nothing — a manual
      # re-run of a genuinely stale repo looked fixed. A dispatch on main is
      # a deliberate operator re-run and is treated exactly like a push;
      # a dispatch on any other ref still takes the no-commit path.
      - name: Regen delta (push to main / dispatch on main)
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          # cargo's bundled libgit2 ignores url.insteadOf; force the real git
          # binary so the credential above applies to dep resolution.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        # nixpkgs#rustc alongside cargo: `cargo metadata` shells out to
        # `rustc -vV`, and cargo alone leaves that resolving against the
        # runner's rustup SHIM, which then tries to materialize the consumer's
        # pinned rust-toolchain.toml over the network mid-job. Same hole fixed
        # in image-push.yml; see its comment for the live hanabi repro.
        run: nix shell nixpkgs#cargo nixpkgs#rustc --command nix run ${{ inputs.gen-ref }} -- build . --commit

      # Every non-main-push path: a PR, or a dispatch on a non-main ref.
      # Regen only, never commit. Paired with the gate above so the two arms
      # are TOTAL over the events this reusable can receive — that totality
      # is the actual fix; a third event must not silently fall through both.
      - name: Regen delta (PR / off-main dispatch — no commit)
        if: >-
          github.event_name == 'pull_request'
          || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        # See the --commit step above: rustc must come from nixpkgs too, or
        # `cargo metadata` falls through to the runner's rustup shim.
        run: nix shell nixpkgs#cargo nixpkgs#rustc --command nix run ${{ inputs.gen-ref }} -- build .

      # Drift = the PR didn't include a fresh regen of the committed delta.
      # (Cargo.build-spec.json is gitignored under delta-only, so it never
      # registers as a tracked diff.)
      - name: Fail PR if delta regen was not included
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- Cargo.gen.lock; then
            echo "::error::stale Cargo.gen.lock — run \`gen build . --commit\` locally and include the regen commit."
            git --no-pager diff -- Cargo.gen.lock | head -200
            exit 1
          fi

      # Must match the --commit arm above EXACTLY. When these two diverged, a
      # dispatch on main committed the regenerated delta locally and then
      # never pushed it, so the commit was discarded with the runner and the
      # next run regenerated the same delta again — a silent no-progress loop.
      - uses: pleme-io/actions/git-push-with-token@main
        if: >-
          github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "false"
