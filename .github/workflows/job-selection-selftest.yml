# job-selection-selftest — assert which jobs these reusable workflows run.
#
# WHY. On 2026-08-08 graphql-synthesizer ran cargo-auto-release. The run
# reported SUCCESS. `bump` bumped, tagged and pushed; `ship` was SKIPPED; the
# crate was never published; and nothing said so. The condition —
# `needs.bump.outputs.bumped == 'true' && !github.event.repository.private` — is
# correct and deliberate. The failure was that nobody had written down WHICH
# JOBS MUST RUN for a given input, so a deliberate no-publish and a broken one
# were the same green tick.
#
# Unit tests cannot see that: the condition is not in any action's code.
# actionlint cannot see it: the expression is valid. This is the missing third
# layer — evaluate each job's `if:` against a table of contexts and compare the
# selected set against what the table declares.
#
# NO MATRIX, NO LIST. The action discovers every `<workflow>.cases.tsv` beside
# its `<workflow>.yml`, so adding a table is the WHOLE act of adding coverage.
# A hand-listed matrix would be a second place to remember, and the table nobody
# remembered to add to it is indistinguishable from one that passes — which is
# the same class of defect this check exists to catch, one level up.
#
# Discovery finding nothing is a failure, not a pass.

name: job-selection-selftest

on:
  push:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.cases.tsv'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.cases.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection:
    name: 'selection · every table in .github/workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A table naming a job the workflow lacks is STALE; a job named in no case
      # is reported unasserted. So adding a job without covering it is visible
      # here rather than discovered later by its absence.
      - uses: pleme-io/actions/job-selection-lint@main
        with:
          workflow-dir: .github/workflows
          fail-on-violation: "true"
