# Ansible collection published-install -- reusable composite workflow (Layer 2).
#
# Composes:
#   - actions/setup-python@v5 + pip-install ansible + akeyless
#   - ansible-galaxy collection install + ansible-doc smoke
#
# Consumer (.github/workflows/published-install.yml):
#   on: { schedule: [{ cron: '23 6 * * *' }], workflow_dispatch: {} }
#   jobs:
#     install:
#       uses: pleme-io/substrate/.github/workflows/ansible-collection-published-install.yml@main
#       with:
#         collection: drzln0.akeyless
#
# Verifies the *published* Galaxy artifact still installs cleanly and that
# every named module surfaces through ansible-doc. Defaults to a baked-in
# sample (role, auth_method_api_key, uid_generate_token, secret_value_info)
# representing the four module families.

name: Ansible collection published-install

on:
  workflow_call:
    inputs:
      collection:
        type: string
        required: true
      modules:
        type: string
        default: ""

jobs:
  install:
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install ansible 'akeyless>=5.0.22'

      - run: ansible-galaxy collection install ${{ inputs.collection }} --force

      - shell: bash
        run: |
          # ── THIS LOOP USED TO DISCARD EVERY FAILURE BUT THE LAST ──────────
          # Was:
          #   ansible-doc ... && echo "OK $m" || (echo "FAIL $m" && exit 1)
          # `exit 1` inside `( )` leaves the SUBSHELL, not the script, and this
          # block had no `set -e`. So a failing module printed FAIL, the loop
          # carried on, and the step's exit status was whatever the LAST
          # iteration returned. Module 1 broken + module 4 fine reported SUCCESS
          # -- a verification loop that verifies and then throws the answer away.
          # Found by actionlint's SC2015 (it flags the A && B || C shape; the
          # subshell exit is the sharper defect underneath it).
          #
          # Now: every module is still checked (so one break does not mask the
          # rest), failures accumulate into rc, and the step fails if ANY failed.
          set -uo pipefail
          mods="${{ inputs.modules }}"
          if [ -z "$mods" ]; then
            mods="role auth_method_api_key uid_generate_token secret_value_info"
          fi
          rc=0
          for m in $mods; do
            if ansible-doc -t module "${{ inputs.collection }}.$m" >/dev/null; then
              echo "OK $m"
            else
              echo "FAIL $m"
              rc=1
            fi
          done
          exit "$rc"
