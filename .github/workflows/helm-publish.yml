# Reusable workflow: lint, package, and push a Helm chart to an OCI registry.
#
# Usage (from a consumer repo):
#
#   jobs:
#     helm:
#       uses: pleme-io/substrate/.github/workflows/helm-publish.yml@main
#       with:
#         chartPath: ./charts/my-chart      # default: "./charts"
#         registry: oci://ghcr.io/pleme-io/charts  # default
#         version: ""                       # optional; parsed from Chart.yaml
#         libChartDir: ""                   # optional, for file:// deps (e.g. pleme-lib)
#       secrets:
#         BOT_PAT: ${{ secrets.BOT_PAT }}   # only if token-source is pat
#
# Strategy:
#   - Prefers `forge helm release` (lint + package + push as one transaction).
#   - Falls back to `helm lint && helm package && helm push` for repos that
#     don't yet have forge available in their flake.
#
# Registry credential (ghcr): the job's own GITHUB_TOKEN, with
# `permissions: packages: write`. App installation tokens CANNOT talk to
# ghcr (see the Registry login step). Chart packages are public — pulls are
# anonymous, so there is no pull-side credential at all.
#
# Expected chart layout: a directory containing a `Chart.yaml`. If the chart
# depends on a sibling library chart (file://...), pass libChartDir.

name: helm-publish

on:
  workflow_call:
    inputs:
      chartPath:
        description: "Path to the Helm chart directory (containing Chart.yaml)"
        type: string
        default: "./charts"
      registry:
        description: "OCI registry URL (oci:// scheme)"
        type: string
        default: "oci://ghcr.io/pleme-io/charts"
      version:
        description: "Override chart version; defaults to Chart.yaml's version"
        type: string
        default: ""
      libChartDir:
        description: "External library chart directory copied as a sibling for file:// deps"
        type: string
        default: ""
      libChartName:
        description: "Library chart name (passed through to forge helm release)"
        type: string
        default: "pleme-lib"
      runner:
        description: "Runner label. Empty routes by caller visibility: a private caller to vars.PRIVATE_BUILDER_RUNNER or pleme-private, a public caller to ubuntu-latest."
        type: string
        default: ""
      token-source:
        description: 'Where the job takes its GitHub token (pleme-io/actions/github-token): app (default) is the short-lived installation token the self-hosted runner host mints from the fleet App, absent on hosted runners, where GITHUB_TOKEN is presented instead; pat presents BOT_PAT; none presents nothing.'
        type: string
        default: 'app'
    secrets:
      BOT_PAT:
        description: "Long-lived PAT for the Nix installer's GitHub API calls, presented only when token-source is pat."
        required: false

jobs:
  publish:
    name: Lint, package & push chart
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    permissions:
      contents: read
      packages: write
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: pleme-io/actions/nix-setup@main
        with:
          github-token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Registry login
        # ghcr.io accepts PATs and the calling repo's own GITHUB_TOKEN — and
        # NOTHING else: GitHub App installation tokens are rejected by the
        # registry even with packages:write (login succeeds, every registry
        # operation 403s "denied"; measured 2026-11-20, community
        # discussions 171423 + 24636). The earlier "measured working
        # 2026-08-22" receipt was a LOGIN-only probe — the exact trap. So
        # this caller passes no app-token rung: the job's GITHUB_TOKEN
        # (permissions: packages: write above) is the push credential, and
        # the target package must be linked to this repository — org default
        # "inherit access from source repository" is ON (measured
        # 2026-11-20), so packages this repo creates are linked at birth;
        # pre-existing ones need the one-time link (package page → Connect
        # Repository). docker client: helm-oci-publish reads
        # ~/.docker/config.json, not helm's own config.
        uses: pleme-io/actions/registry-login@main
        with:
          registry: ${{ inputs.registry }}
          client: docker
          username: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: Lint, package & push chart
        uses: pleme-io/actions/helm-oci-publish@main
        with:
          chart-path:     ${{ inputs.chartPath }}
          registry:       ${{ inputs.registry }}
          version:        ${{ inputs.version }}
          lib-chart-dir:  ${{ inputs.libChartDir }}
          lib-chart-name: ${{ inputs.libChartName }}
          # The nix backend runs run.tlisp and takes helm from nixpkgs: a
          # pure-nix self-hosted runner has no docker for a container
          # action (measured 2026-11-21, the helmworks-release pool's
          # first job — "docker: command not found" pulling the image).
          backend:        nix
