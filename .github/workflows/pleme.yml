name: pleme

# THE UNIVERSAL COMPOSER — one entry point over the catalogued reusables.
#
# A consumer that does not want to choose can call exactly this, name its
# profile, and get the fleet-standard CI + release for that shape:
#
#     jobs:
#       pleme:
#         uses: pleme-io/substrate/.github/workflows/pleme.yml@main
#         with:
#           profile: rust-workspace
#         secrets: inherit
#
# WHAT THIS IS AND IS NOT
#
# It is a DISPATCHER, not a reimplementation. Every arm delegates to a
# workflow already in catalog/workflows.lisp; this file contributes the
# profile vocabulary and nothing else. Adding behaviour here instead of in the
# workflow it fronts is the one way to make it harmful, because the dispatcher
# is the thing nobody reads.
#
# WHY 14 PROFILES AND NOT ALL 73 REUSABLES — the limit, measured
#
# This file sits at 20 `uses:` calls, which is EXACTLY GitHub's per-workflow
# cap. Not a design preference and not room left on the table: the boundary is
# consumed. 14 profiles reach 19 of the catalogue's 73 reusables, which is
# 824 of 1481 measured consumer call-sites — 56% of everything the fleet
# actually calls, in one entry point.
#
# The obvious escape — a tier of per-family sub-composers — is NOT available,
# and that was measured rather than assumed. GitHub allows a chain of 4
# workflows, and several leaves already spend a level of it: cargo-ci.yml and
# pre-merge-gate.yml each call a reusable of their own. So
# consumer(1) → pleme(2) → cargo-ci(3) → its child(4) is already AT the limit.
# Inserting pleme-rust(3) would make it 5 and the run would not start.
#
# So the structure is two layers because the platform makes it two layers:
# this composer for the profiles that carry the majority of call-sites, and
# catalog/workflows.lisp as the complete index for the other 54. Calling a
# reusable directly stays a first-class answer — `workflow-shim-lint` accepts
# it identically, and for the 54 it is the ONLY answer.
#
# HONEST STATUS: 0 consumers. Every arm is a workflow with real adoption
# (362, 337, 166, 164, …), but this composition of them has never run. The
# fleet already carries 34 zero-consumer reusables; do not cite this one as
# load-bearing until something calls it.

on:
  workflow_call:
    inputs:
      profile:
        description: >-
          The repo's shape. Determines which catalogued reusables run.

            rust-workspace     cargo workspace WITH a flake   (cargo-ci + cargo-auto-release)
            rust-bare          cargo, NO flake.nix            (cargo-gate-ci + rust-auto-release)
            go                 Go module                      (go-auto-release)
            ruby-gem           Ruby gem                       (gem-ci + gem-auto-bump + gem-release)
            nix-image          Nix-built container image      (nix-image-auto-release)
            node-package       npm package                    (npm-auto-release)
            python-package     Python package                 (python-auto-release)
            ansible-collection Ansible collection             (ansible-collection-ci + -release)
            caixa-package      a (defcaixa …) package         (caixa-validate + caixa-publish)
            helm-chart         Helm chart                     (helm-publish)
            container-image    prebuilt image push            (image-push)
            iac-crossplane     Crossplane provider            (crossplane-provider-publish)
            iac-terraform      Terraform provider             (terraform-provider-publish)
            action-repo        a pleme-io/actions-style repo  (gate only; its release lives
                               in pleme-actions' release-action.yml, called directly)
        required: true
        type: string
      stages:
        description: "ci | release | both"
        required: false
        type: string
        default: "both"
      bump-type:
        description: "patch | minor | major, for the release stage"
        required: false
        type: string
        default: patch
      runner:
        required: false
        type: string
        default: ""

jobs:
  # ── validation ───────────────────────────────────────────────────────
  # An unknown profile must FAIL, not silently run nothing. Every arm below
  # is `if:`-gated, so a typo like `profile: rust_workspace` would otherwise
  # skip every job and report a green run that did no work — the same
  # green-over-nothing shape as the `dep-missing` defer this fleet just fixed.
  validate:
    name: "profile is known"
    runs-on: ${{ inputs.runner != '' && inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: pleme-io/actions/tatara-script@main
        with:
          script: |
            (define known
              (list
                "rust-workspace" "rust-bare" "go" "ruby-gem" "nix-image" "node-package"
                "python-package" "ansible-collection" "caixa-package" "helm-chart"
                "container-image" "iac-crossplane" "iac-terraform" "action-repo"))
            (define p (env-get "PROFILE" ""))
            (define s (env-get "STAGES" "both"))
            (cond
              ((not (member? p known))
                (log-error (string-append "unknown profile '" p "' — known: " (string-join ", " known)))
                (exit 1))
              ((not (member? s (list "ci" "release" "both")))
                (log-error (string-append "unknown stages '" s "' — known: ci, release, both"))
                (exit 1))
              (else (log-info (string-append "profile=" p " stages=" s)) (exit 0)))
        env:
          PROFILE: ${{ inputs.profile }}
          STAGES: ${{ inputs.stages }}

  # ── CI stage ─────────────────────────────────────────────────────────
  ci-rust-workspace:
    needs: validate
    if: inputs.profile == 'rust-workspace' && inputs.stages != 'release'
    uses: ./.github/workflows/cargo-ci.yml
    secrets: inherit

  ci-rust-bare:
    needs: validate
    if: inputs.profile == 'rust-bare' && inputs.stages != 'release'
    uses: ./.github/workflows/cargo-gate-ci.yml
    secrets: inherit

  ci-ruby-gem:
    needs: validate
    if: inputs.profile == 'ruby-gem' && inputs.stages != 'release'
    uses: ./.github/workflows/gem-ci.yml
    secrets: inherit

  ci-ansible-collection:
    needs: validate
    if: inputs.profile == 'ansible-collection' && inputs.stages != 'release'
    uses: ./.github/workflows/ansible-collection-ci.yml
    secrets: inherit

  ci-caixa-package:
    needs: validate
    if: inputs.profile == 'caixa-package' && inputs.stages != 'release'
    uses: ./.github/workflows/caixa-validate.yml
    secrets: inherit

  # Universal quality gate — every profile gets it. This is the job carrying
  # workflow-shim-lint, so a repo adopting the composer also starts reporting
  # its own hand-authored workflows.
  gate:
    needs: validate
    if: inputs.stages != 'release'
    uses: ./.github/workflows/pre-merge-gate.yml
    secrets: inherit

  # ── release stage ────────────────────────────────────────────────────
  release-rust-workspace:
    needs: validate
    if: inputs.profile == 'rust-workspace' && inputs.stages != 'ci'
    uses: ./.github/workflows/cargo-auto-release.yml
    with:
      bump-type: ${{ inputs.bump-type }}
    secrets: inherit

  release-rust-bare:
    needs: validate
    if: inputs.profile == 'rust-bare' && inputs.stages != 'ci'
    uses: ./.github/workflows/rust-auto-release.yml
    with:
      bump-type: ${{ inputs.bump-type }}
    secrets: inherit

  release-go:
    needs: validate
    if: inputs.profile == 'go' && inputs.stages != 'ci'
    uses: ./.github/workflows/go-auto-release.yml
    secrets: inherit

  release-ruby-gem:
    needs: validate
    if: inputs.profile == 'ruby-gem' && inputs.stages != 'ci'
    uses: ./.github/workflows/gem-release.yml
    secrets: inherit

  release-nix-image:
    needs: validate
    if: inputs.profile == 'nix-image' && inputs.stages != 'ci'
    uses: ./.github/workflows/nix-image-auto-release.yml
    secrets: inherit

  release-node-package:
    needs: validate
    if: inputs.profile == 'node-package' && inputs.stages != 'ci'
    uses: ./.github/workflows/npm-auto-release.yml
    secrets: inherit

  release-python-package:
    needs: validate
    if: inputs.profile == 'python-package' && inputs.stages != 'ci'
    uses: ./.github/workflows/python-auto-release.yml
    secrets: inherit

  release-ansible-collection:
    needs: validate
    if: inputs.profile == 'ansible-collection' && inputs.stages != 'ci'
    uses: ./.github/workflows/ansible-collection-release.yml
    secrets: inherit

  release-caixa-package:
    needs: validate
    if: inputs.profile == 'caixa-package' && inputs.stages != 'ci'
    uses: ./.github/workflows/caixa-publish.yml
    secrets: inherit

  release-helm-chart:
    needs: validate
    if: inputs.profile == 'helm-chart' && inputs.stages != 'ci'
    uses: ./.github/workflows/helm-publish.yml
    secrets: inherit

  release-container-image:
    needs: validate
    if: inputs.profile == 'container-image' && inputs.stages != 'ci'
    uses: ./.github/workflows/image-push.yml
    secrets: inherit

  release-iac-crossplane:
    needs: validate
    if: inputs.profile == 'iac-crossplane' && inputs.stages != 'ci'
    uses: ./.github/workflows/crossplane-provider-publish.yml
    secrets: inherit

  release-iac-terraform:
    needs: validate
    if: inputs.profile == 'iac-terraform' && inputs.stages != 'ci'
    uses: ./.github/workflows/terraform-provider-publish.yml
    secrets: inherit
