name: caixa-auto-release

# Reusable workflow: on push to main, bump a (defcaixa ...) form,
# re-render cluster artifacts via feira, commit, tag, push, and
# publish the rendered Helm chart to the OCI registry.
#
# Consumer:
#   on: { push: { branches: [main] } }
#   jobs:
#     release:
#       uses: pleme-io/substrate/.github/workflows/caixa-auto-release.yml@main
#       secrets: inherit

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Empty routes by caller visibility: a private caller to vars.PRIVATE_BUILDER_RUNNER or pleme-private, a public caller to ubuntu-latest."
        type: string
        default: ""
      bump-type:
        type: string
        required: false
        default: patch
      caixa-path:
        type: string
        required: false
        default: ""
      token-source:
        description: 'Where each job takes its GitHub token (pleme-io/actions/github-token): app (default) is the short-lived installation token the self-hosted runner host mints from the fleet App, absent on hosted runners, where GITHUB_TOKEN is presented instead; pat presents BOT_PAT; none presents nothing.'
        type: string
        default: 'app'
    secrets:
      BOT_PAT:
        description: "Long-lived PAT, presented only when token-source is pat."
        required: false

permissions:
  contents: write
  packages: write

jobs:
  bump:
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    if: github.actor != 'github-actions[bot]'
    outputs:
      bumped: ${{ steps.b.outputs.bumped }}
      new-version: ${{ steps.b.outputs.new-version }}
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}

      - id: b
        uses: pleme-io/actions/caixa-bump@main
        with:
          bump-type: ${{ inputs.bump-type }}
          caixa-path: ${{ inputs.caixa-path }}

      - if: steps.b.outputs.bumped == 'true'
        uses: pleme-io/actions/caixa-render@main
        with:
          caixa-path: ${{ inputs.caixa-path }}
          output-dir: rendered/

      - if: steps.b.outputs.bumped == 'true'
        uses: pleme-io/actions/git-commit-tag@main
        with:
          version: ${{ steps.b.outputs.new-version }}
          add-paths: "*.tlisp *.lisp rendered/"

      - if: steps.b.outputs.bumped == 'true'
        uses: pleme-io/actions/git-push-with-token@main
        with:
          token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: main
          push-tags: "true"

  ship:
    needs: bump
    # A reusable workflow's `runs-on` executes in the CALLER's billing
    # context, so a bare metered label here charges every PRIVATE consumer.
    # That is what exhausted the org's Actions spending limit on 2026-08-08,
    # after which every private repo's release path failed INSTANTLY with
    # zero steps — which reads as "autobump/autorelease is broken" rather
    # than "billing blocked". Public callers keep the exact label they had.
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    if: needs.bump.outputs.bumped == 'true'
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - uses: pleme-io/actions/caixa-render@main
        with:
          caixa-path: ${{ inputs.caixa-path }}
          output-dir: rendered/
      - uses: pleme-io/actions/caixa-publish@main
        with:
          rendered-dir: rendered/
        env:
          GHCR_TOKEN: ${{ steps.token.outputs.pat || secrets.GITHUB_TOKEN }}
