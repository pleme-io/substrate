# Reusable workflow to publish Nix flakes to FlakeHub
# Usage:
#   jobs:
#     flakehub:
#       uses: pleme-io/substrate/.github/workflows/reusable-flakehub.yml@main
#       with:
#         visibility: public  # or unlisted
#         rolling: true      # branch-based versioning
#
# A blue project does not write this call by hand: blue's registry renders
# it from the Bluefile (`registry(:flakehub, ...)`, visibility from
# `package(name, version, visibility)`), gated fresh. See
# pleme-io/blue docs/REGISTRY.md.

name: reusable-flakehub

on:
  workflow_call:
    inputs:
      visibility:
        description: "Flake visibility: public, unlisted, or private (private needs a paid FlakeHub org plan)"
        required: false
        type: string
        default: public
      rolling:
        description: "Use rolling versioning (for branch-based releases)"
        required: false
        type: boolean
        default: true
      directory:
        description: "Flake directory (relative to repo root)"
        required: false
        type: string
        default: .
      # Runner routing: empty default routes by CALLER repo visibility —
      # private repos → the pleme-io-org self-hosted ARC pool (vars.PRIVATE_BUILDER_RUNNER)
      # (avoids billed hosted minutes), public repos → ubuntu-latest. Keyed
      # off github.event.repository.private (the caller's event payload),
      # never an org-level Actions variable — pleme-io's GitHub Free org
      # plan doesn't share org vars/secrets into private repos' workflow
      # context. Same idiom as rust-auto-release.yml/python-auto-release.yml.
      runner:
        description: "Runner label. Empty routes by caller visibility: a private caller to vars.PRIVATE_BUILDER_RUNNER or pleme-private, a public caller to ubuntu-latest."
        type: string
        default: ""
      token-source:
        description: 'Where the job takes its GitHub token (pleme-io/actions/github-token): app (default) is the short-lived installation token the self-hosted runner host mints from the fleet App, absent on hosted runners, where GITHUB_TOKEN is presented instead; pat presents BOT_PAT; none presents nothing.'
        type: string
        default: 'app'
    # No secrets stanza — publish uses OIDC. An empty `secrets:` with only
    # a comment parses as `secrets: null` and breaks workflow-file
    # validation for callers.

jobs:
  publish:
    if: vars.FLAKEHUB_MODE == 'on'
    runs-on: ${{ inputs.runner != '' && inputs.runner || (github.event.repository.private && (vars.PRIVATE_BUILDER_RUNNER || 'pleme-private') || 'ubuntu-latest') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - id: token
        uses: pleme-io/actions/github-token@main
        with:
          source: ${{ inputs.token-source }}
          pat: ${{ secrets.BOT_PAT }}
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          github-token: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Publish to FlakeHub
        # Pin to v6 (latest tagged release, 2025-07-15) — @main
        # started enumerating devShell stdenv-internal attrs
        # (__darwinAllowLocalNetworking, __structuredAttrs, …) and
        # erroring on missing `.name`. v6 is the last known-good.
        uses: DeterminateSystems/flakehub-push@v6
        with:
          visibility: ${{ inputs.visibility }}
          rolling: ${{ inputs.rolling }}
          directory: ${{ inputs.directory }}